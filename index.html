<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本文分析ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F5; --paper:#FFFFFF; --ink:#1C2740; --sub:#5A6680; --line:#CDD5E1; --focus:#2F6FDB;
  --ok:#1F8A5B; --ng:#D33A3A; --soft:#F5F7FA; --warn:#B26A00;
  --p-noun:#2F6FDB; --p-pron:#7A5AF8; --p-verb:#E0464B; --p-aux:#E8710A; --p-adj:#23955F;
  --p-adv:#B58900; --p-prep:#0E93A0; --p-conj:#D6409F; --p-art:#7D8494;
  --r-S:#2F6FDB; --r-V:#E0464B; --r-O:#23955F; --r-C:#B58900; --r-M:#7D8494;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111722; --paper:#1A2230; --ink:#E6EBF3; --sub:#9AA6BC; --line:#334058; --focus:#7FA8F5;
    --ok:#4CC38A; --ng:#FF6B6B; --soft:#202A3A; --warn:#E3A33B;
    --p-noun:#6E9BF2; --p-pron:#A58BFF; --p-verb:#FF6B6E; --p-aux:#FF9A3D; --p-adj:#4CC38A;
    --p-adv:#E3B83B; --p-prep:#3CC3CF; --p-conj:#F06BBE; --p-art:#A3AAB8;
    --r-S:#6E9BF2; --r-V:#FF6B6E; --r-O:#4CC38A; --r-C:#E3B83B; --r-M:#A3AAB8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111722; --paper:#1A2230; --ink:#E6EBF3; --sub:#9AA6BC; --line:#334058; --focus:#7FA8F5;
  --ok:#4CC38A; --ng:#FF6B6B; --soft:#202A3A; --warn:#E3A33B;
  --p-noun:#6E9BF2; --p-pron:#A58BFF; --p-verb:#FF6B6E; --p-aux:#FF9A3D; --p-adj:#4CC38A;
  --p-adv:#E3B83B; --p-prep:#3CC3CF; --p-conj:#F06BBE; --p-art:#A3AAB8;
  --r-S:#6E9BF2; --r-V:#FF6B6E; --r-O:#4CC38A; --r-C:#E3B83B; --r-M:#A3AAB8;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:16px;line-height:1.7}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.en,.w{font-family:"Literata",Georgia,"Times New Roman",serif}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.hin{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:1.05rem}
.brand small{font-weight:400;color:var(--sub);margin-left:8px;font-size:.8rem}
.modes{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:500;color:var(--sub)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.unit{margin:0;color:var(--sub);font-size:.9rem}
.tag{margin-left:8px;font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
h1{margin:2px 0 0;font-size:1.7rem;line-height:1.3}
h2{font-size:1.15rem;margin:0 0 8px}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--sub)}
select,input[type=text],input[type=password],textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.steps button{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left}
.steps .num{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:700;font-size:.85rem}
.steps .lab{font-weight:700}
.steps .cnt{margin-left:auto;color:var(--sub);font-size:.8rem}
.steps button[aria-current="step"]{border-color:var(--ink)}
.steps button[aria-current="step"] .num{background:var(--ink);color:var(--paper)}
@media (max-width:600px){.steps .cnt{display:none}.steps button{flex-direction:column;gap:2px;text-align:center}.steps .lab{font-size:.85rem}}

.guide{background:var(--paper);border-left:5px solid var(--ink);padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--sub);margin:-4px 0 14px}
.legend b{display:inline-block;min-width:2.2em;text-align:center;border-radius:4px;color:#fff;padding:0 4px;margin-right:4px}
.banner{background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem}
.linkbtn{border:0;background:none;color:var(--focus);text-decoration:underline;padding:0 4px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.sno{font-size:.8rem;color:var(--sub);margin-bottom:6px}

/* 意味調べ */
.mrow{display:grid;grid-template-columns:1fr minmax(160px,260px);gap:12px;align-items:center}
.mrow .en{font-size:1.35rem;font-weight:600}
.ctx{margin:0;color:var(--sub);font-size:.95rem;font-family:"Literata",Georgia,serif}
.ctx b{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}

/* かたまり */
.line{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:16px;column-gap:0}
.chunk{display:inline-flex;flex-direction:column;align-items:center}
.cw{display:flex;align-items:stretch;border:2px solid var(--ink);border-top:0;border-radius:0 0 10px 10px;padding:0 6px 2px;min-height:44px}
.w{font-size:1.35rem;padding:4px 2px;align-self:center}
.gap{width:20px;min-height:44px;border:0;background:none;padding:0;position:relative}
.gap::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--line)}
.gap:hover::after{background:var(--focus)}
.gap.on{width:22px;align-self:stretch;min-height:44px}
.gap.on::after{width:2px;height:70%;margin:0 0 0 -1px;top:15%;border-radius:1px;background:var(--focus)}
.role{margin-top:6px;border:1.5px dashed var(--sub);background:var(--paper);border-radius:999px;padding:1px 12px;font-size:.85rem;min-width:56px;min-height:40px;font-weight:700;color:var(--sub)}
.role.set,.role.static{border-style:solid;color:#fff;border-color:transparent}
.role[data-r="S"]{background:var(--r-S)}.role[data-r="V"]{background:var(--r-V)}.role[data-r="O"]{background:var(--r-O)}.role[data-r="C"]{background:var(--r-C)}.role[data-r="修飾"]{background:var(--r-M)}.role[data-r="つなぎ"]{background:var(--p-conj)}
.role.static[data-r=""]{background:var(--soft);color:var(--sub);border:1.5px dashed var(--sub)}
.dot{color:var(--ink);font-size:1.35rem;align-self:flex-start;padding-top:6px;font-family:"Literata",serif}

/* 品詞 */
.palette{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;display:flex;flex-wrap:wrap;gap:6px;background:var(--bg);padding:8px 0 10px;margin-bottom:6px}
.palette button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font-weight:500;min-height:44px}
.palette i{width:14px;height:14px;border-radius:3px;background:var(--c)}
.palette button[aria-pressed="true"]{border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 1.5px var(--c,var(--ink));font-weight:700}
.palette .qt{--c:var(--warn)}
.palette .xt{--c:var(--sub)}
.wline{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:flex-end}
.wd{position:relative;display:inline-flex;flex-direction:column;align-items:center;border:0;background:none;padding:4px 6px 2px;border-bottom:5px solid var(--c);border-radius:6px 6px 0 0;min-width:44px}
.wd.has{background:color-mix(in srgb,var(--c) 14%,transparent)}
.wd .en{font-size:1.35rem;line-height:1.3}
.wd.gl{margin-left:-3px}
.wd .pl{font-size:.72rem;color:var(--c);font-weight:700;min-height:1.1em;white-space:nowrap}
.wd:not(.has) .pl{color:var(--sub)}
.qb{position:absolute;top:-8px;right:-6px;background:var(--warn);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.75rem;display:grid;place-items:center;font-weight:700}
.end{font-family:"Literata",serif;font-size:1.35rem;align-self:center}

/* 提出 */
.check{list-style:none;padding:0;margin:0 0 12px}
.check li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.check .ng{color:var(--warn);font-weight:700}
.check .ok{color:var(--ok);font-weight:700}
textarea{width:100%;min-height:80px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.secondary{background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:10px 18px;font-weight:700}

/* 結果 */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score .big{font-size:3rem;font-weight:700;line-height:1}
.score .big small{font-size:1.1rem}
.cats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--sub)}
.cats b{color:var(--ink)}
.rv{display:flex;flex-wrap:wrap;row-gap:12px;align-items:flex-start}
.chunk.view .cw{padding:0 4px 2px;gap:2px;align-items:flex-end}
.chunk.view.bad .cw{border-color:var(--ng)}
.wd.static{cursor:default}
.wd.static.bad{border-bottom-style:double;border-bottom-color:var(--ng)}
.x{color:var(--ng);margin-left:2px}
.fix{color:var(--ng);margin-left:4px}
.role.static.bad{outline:2px solid var(--ng);outline-offset:1px}
.keyline{margin:10px 0 0;font-size:.9rem;color:var(--sub);font-family:"Literata",serif}
.keyline sub{font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);font-weight:700;margin-right:6px}
.mlist{width:100%;border-collapse:collapse;font-size:.95rem}
.mlist td{padding:6px 4px;border-bottom:1px solid var(--line)}
.okc{color:var(--ok);font-weight:700}.ngc{color:var(--ng);font-weight:700}

/* 講師画面 */
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.stats div{font-size:.85rem;color:var(--sub)}
.stats b{display:block;font-size:1.3rem;color:var(--ink)}
.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
table.roster{width:100%;border-collapse:collapse;min-width:680px;font-size:.92rem}
.roster th{text-align:left;font-weight:500;color:var(--sub);font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line)}
.roster td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.roster tr.row{cursor:pointer}
.roster tr.row:hover td{background:var(--soft)}
.roster tr.sel td{background:color-mix(in srgb,var(--focus) 10%,transparent)}
.st{font-size:.8rem;border-radius:4px;padding:2px 8px;white-space:nowrap}
.st.none{background:var(--soft);color:var(--sub)}
.st.wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);font-weight:700}
.st.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-weight:700}
.bar{position:relative;display:inline-block;width:110px;height:8px;background:var(--soft);border-radius:4px;vertical-align:middle;margin-right:8px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ok)}
.bar i.low{background:var(--ng)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:5.5em 1fr 3em;align-items:center;gap:8px;font-size:.88rem;margin:4px 0}
.hb .bar{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.9rem;font-family:"Literata",serif}
.chip span{font-family:"Zen Maru Gothic",sans-serif;color:var(--warn);font-weight:700;margin-left:4px}
.detail h2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.scaf{margin:0;padding-left:1.2em}
.scaf li{margin:4px 0}
.memo{background:var(--soft);border-radius:8px;padding:8px 12px;margin:0}
.checkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub);font-size:.88rem}
.snav{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.snav button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;min-height:44px;font-weight:500}
.snav button.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.snav button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card.big{padding:22px 18px}
.card.big .w,.card.big .wd .en,.card.big .end{font-size:1.65rem}
.card.big .wd{min-width:52px;padding:6px 8px 3px}
.card.big .wline{gap:12px 6px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.pager button[disabled]{opacity:.35;cursor:default}
.sech{margin:22px 0 6px}
.mcount{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem;margin-top:6px}
.mcount span:not(:first-child){border-radius:4px;padding:1px 8px;font-weight:700}
.t-品詞{background:color-mix(in srgb,var(--p-verb) 15%,transparent);color:var(--p-verb)}
.t-かたまり{background:color-mix(in srgb,var(--p-noun) 15%,transparent);color:var(--p-noun)}
.t-意味{background:color-mix(in srgb,var(--p-adj) 15%,transparent);color:var(--p-adj)}
.msent{font-family:"Literata",Georgia,serif;font-size:1.25rem;margin:2px 0 10px;line-height:2}
.msent .bp{color:var(--ng);font-weight:600}
.msent .bc{text-decoration:underline dashed var(--p-noun);text-decoration-thickness:2px;text-underline-offset:6px}
.msent.small{font-size:.95rem;margin:0;color:var(--sub);line-height:1.5}
.okrow{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:10px 16px}
.okrow .sno{margin:0}
.mks{display:grid;gap:10px}
.mk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
.mk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mk-h .en{font-size:1.15rem}
.mk-type{font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 8px}
.qtag{font-size:.75rem;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 6px}
.mk-ans{display:flex;gap:6px 18px;flex-wrap:wrap;margin:6px 0 4px;font-size:.95rem}
.mk-ans .was{color:var(--ng);text-decoration:line-through;text-decoration-thickness:1px}
.mk-ans .right{color:var(--ok);font-weight:700}
.why,.ask{margin:4px 0 0;font-size:.92rem;display:grid;grid-template-columns:4em 1fr;gap:6px}
.why b,.ask b{color:var(--sub);font-weight:500;font-size:.82rem;padding-top:2px}
details.card summary{cursor:pointer;font-weight:700}
.foot{margin-top:28px;font-size:.82rem;color:var(--sub)}
.foot button{margin-left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 本番版で足したもの ===== */
.hright{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--sub);flex-wrap:wrap;justify-content:flex-end}
.hright .linkbtn{min-height:44px}
.savest{font-size:.8rem}
.savest.err{color:var(--ng);font-weight:700}
.login{max-width:460px;margin:24px auto}
.login h1{margin-bottom:8px}
.login label{display:block;margin:14px 0 4px;font-weight:700}
.login input,.login select{width:100%;min-height:44px}
.login .modes{display:inline-flex;margin-top:6px}
.login .modes button{min-height:44px;padding:6px 22px}
.login .primary{width:100%;margin-top:18px;min-height:48px}
.banner.err{border:1px solid var(--ng);color:var(--ng);background:color-mix(in srgb,var(--ng) 8%,var(--paper));margin:0 0 12px}
.lcard{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:12px;min-height:64px;font:inherit}
.lcard b{display:block;font-size:1.1rem}
.lcard .unit{font-size:.82rem}
.tctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tctl .secondary{min-height:44px}
.loading{padding:30px 0;text-align:center}
button[disabled]{opacity:.5;cursor:default}

/* ===== v2 で足したもの ===== */
.src{margin:0;color:var(--sub);font-size:.78rem;line-height:1.5}
.lcard .src{display:block;margin-top:2px}
.login .modes{flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 18px;min-height:44px;font-weight:700;color:var(--sub)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.jsonbox{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem;line-height:1.5}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btnrow .primary,.btnrow .secondary{min-height:44px}
.errlist{margin:6px 0 0;padding-left:1.2em;color:var(--ng)}
.errlist li{margin:2px 0}
.okmsg{color:var(--ok);font-weight:700}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .secondary{min-height:44px;flex:none}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;font-weight:700}
.field select,.field input{min-height:44px;font-weight:400}
.sgrade{margin:12px 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sgrade h3{margin:0;font-size:1rem}
.sgrade .linkbtn{min-height:44px}
.stu{display:flex;align-items:center;gap:10px;min-height:44px;padding:2px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.stu input{width:22px;height:22px;flex:none}
.stu .nm{flex:1}
.pvbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
</style>
</head>
<body>
<header><div class="hin">
  <div class="brand">本文分析ノート<small>v2</small></div>
  <div class="hright" id="hright"></div>
</div></header>
<main id="main"></main>

<script>
/* ===== 設定 ===== */
const VERSION=2;
/* ↓ GAS を「ウェブアプリ」として公開したときの URL を ' ' の間に貼る（docs/setup.md 手順7） */
const API_URL='https://script.google.com/macros/s/AKfycbxUiT8hdHzK3Ol4ZKZJT1hFNnyWGQolkUCGVA3amXMKUl_dXqweX0BrD6XMpVfs9Q_j/exec';

const POS=[
 {k:'名',name:'名詞',v:'--p-noun'},{k:'代',name:'代名詞',v:'--p-pron'},{k:'動',name:'動詞',v:'--p-verb'},
 {k:'助',name:'助動詞',v:'--p-aux'},{k:'形',name:'形容詞',v:'--p-adj'},{k:'副',name:'副詞',v:'--p-adv'},

const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const posOf=k=>POS.find(p=>p.k===k);
const posName=k=>posOf(k)?.name||'';
const posVar=k=>posOf(k)?`var(${posOf(k).v})`:'var(--line)';
const posOk=(tk,v)=>!!v&&(v===tk.pos||(tk.alt||[]).includes(v));
const jt=toks=>toks.map((t,i)=>(i&&!t.glue?' ':'')+t.w).join('');
const words=(L,si,a,b)=>jt(L.sentences[si].tokens.slice(a,b+1));
/* サーバーの日時「2026/10/20 13:05:00」→「10/20 13:05」 */
const fmt=s=>{const m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(s||''));if(!m)return String(s||'');return `${+m[2]}/${+m[3]}${m[4]?` ${m[4].padStart(2,'0')}:${m[5]}`:''}`};
const fmtDate=s=>{const m=/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(String(s||''));return m?`${+m[2]}/${+m[3]}`:String(s||'')};
const uuid=()=>{try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12)+'-'+Math.random().toString(36).slice(2,12)};

/* ===== 通信 ===== */
async function api(action,payload={}){
 if(!API_URL)throw new Error('API_URL が設定されていません。');
 const body=Object.assign({action,classCode:S.classCode},S.auth?.token?{token:S.auth.token}:{},payload);
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
 let res;
 try{res=await fetch(API_URL,{method:'POST',body:JSON.stringify(body),signal:ctl.signal})}
 catch(e){throw new Error('通信できませんでした。インターネットにつながっているか確かめて、もう一度ためしてください。')}
 finally{clearTimeout(tm)}
 let j;
 try{j=await res.json()}catch(e){throw new Error('サーバーからの返事が読めませんでした。少し待ってからもう一度ためしてください。')}
 if(j.status!=='ok'){const err=new Error(j.message||'エラーが起きました。');err.code=j.code||'';throw err}
 return j;
}

/* ===== 答えの形 ===== */
function blankA(L){return{meanings:{},bounds:L.sentences.map(()=>[]),roles:L.sentences.map(()=>({})),pos:L.sentences.map(s=>s.tokens.map(()=>null)),q:{},memo:''}}
function fitA(L,a){
 const b=blankA(L);a=a||{};
 b.meanings=Object.assign({},a.meanings);b.q=Object.assign({},a.q);b.memo=String(a.memo||'');
 L.sentences.forEach((s,si)=>{
  b.bounds[si]=Array.isArray(a.bounds?.[si])?a.bounds[si].slice():[];
  b.roles[si]=Object.assign({},a.roles?.[si]);
  const p=a.pos?.[si]||[];b.pos[si]=s.tokens.map((_,ti)=>p[ti]||null);
 });
 return b;
}
function chunksFrom(bounds,n){
 const b=[...new Set(bounds)].sort((x,y)=>x-y);const out=[];let st=0;
 for(const g of b){if(g>=st&&g<n-1){out.push([st,g]);st=g+1}}
 out.push([st,n-1]);return out;
}
function counts(L,a){
 let r=0,rn=0,p=0,pn=0;
 L.sentences.forEach((s,si)=>{const ch=chunksFrom(a.bounds[si],s.tokens.length);rn+=ch.length;r+=ch.filter(c=>a.roles[si][c[0]+'-'+c[1]]).length;pn+=s.tokens.length;p+=a.pos[si].filter(Boolean).length});
 const m=L.words.filter(w=>(a.meanings[w.w]||'').trim()).length;
 return{m,mn:L.words.length,r,rn,p,pn};
}

/* ===== 下書きの自動保存 ===== */
function markDirty(){
 if(S.screen==='preview')return;
 SV.ver++;SV.state='dirty';S.submitId=null;
 lsSet(draftKey(S.auth.studentId,S.L.lessonId),{answers:S.draft,pending:true});
 clearTimeout(SV.timer);SV.timer=setTimeout(flushDraft,3000);
 updateSaveState();
}
function flushDraft(){
 clearTimeout(SV.timer);SV.timer=null;
 if(S.auth?.role!=='student'||!S.L||SV.ver===SV.savedVer)return Promise.resolve();
 if(SV.inflight){SV.again=true;return SV.inflight}
 const ver=SV.ver,answers=clone(S.draft),sid=S.auth.studentId,lid=S.L.lessonId;
 SV.state='saving';updateSaveState();
 SV.inflight=(async()=>{
  try{
   await api('saveDraft',{lessonId:lid,answers});
   SV.savedVer=Math.max(SV.savedVer,ver);
   if(SV.ver===ver){SV.state='saved';lsSet(draftKey(sid,lid),{answers,pending:false})}else SV.state='dirty';
  }catch(e){
   SV.state='error';
   if(e.code){handleError(e);render()}else SV.timer=setTimeout(flushDraft,10000);
  }finally{
   SV.inflight=null;updateSaveState();
   if(SV.again){SV.again=false;if(SV.ver!==SV.savedVer)flushDraft()}
  }
 })();
 return SV.inflight;
}
function beaconFlush(){
 if(S.auth?.role==='student'&&S.L&&SV.ver!==SV.savedVer&&API_URL&&navigator.sendBeacon){
  navigator.sendBeacon(API_URL,JSON.stringify({action:'saveDraft',classCode:S.classCode,token:S.auth.token,lessonId:S.L.lessonId,answers:S.draft}));
 }
}
function updateSaveState(){
 const el=document.getElementById('savest');if(!el)return;
 const on=S.screen==='lesson'&&S.L;
 el.textContent=!on?'':{idle:'',dirty:'入力中…',saving:'保存中…',saved:'保存しました ✓',error:'保存できませんでした。自動でやり直します'}[SV.state];
 el.className='savest'+(SV.state==='error'?' err':'');
}

async function start(){

 S.classCode=saved.classCode||'';S.form.cc=S.classCode;S.tLessonId=saved.tLessonId||'';
 if(saved.auth?.token&&API_URL){

  if(S.auth.role==='student')return goList();
  if(S.auth.role==='admin')return loadAdmin();

 }

 S.auth=null;S.roster=null;S.screen='login';S.lessons=null;S.L=null;S.tData=null;S.tLessons=null;S.tsel='';

 S.form.pin='';S.form.pass='';S.form.apass='';

/* 生徒・講師・教室長のログイン。合えば通行証（token）をもらって保存する */
async function doLogin(role){
 const f=S.form;let payload;
 if(role==='student'){
  if(!f.sid.trim()||!/^\d{4}$/.test(f.pin.trim())){S.error='生徒番号と、4けたの PIN を入れてください。';return render()}
  payload={role,studentId:f.sid.trim(),pin:f.pin.trim()};
 }else if(role==='teacher'){
  if(!f.tname){S.error='講師の名前を選んでください。';return render()}
  payload={role,teacherName:f.tname,password:f.pass.trim()};
 }else payload={role,password:f.apass.trim()};
 S.busy=true;S.error='';render();
 try{
  const j=await api('login',payload);
  S.auth=role==='student'?{role,classCode:S.classCode,token:j.token,studentId:j.studentId,name:j.name}
   :role==='teacher'?{role,classCode:S.classCode,token:j.token,teacherName:j.teacherName}
   :{role,classCode:S.classCode,token:j.token};
  f.pin='';f.pass='';f.apass='';saveLogin();S.busy=false;
  return role==='student'?goList():role==='teacher'?loadTeacher():loadAdmin();
 }catch(e){S.error=e.message;if(e.code==='class')S.roster=null}
 S.busy=false;render();
}

/* 生徒 */
async function goList(){
 S.screen='list';S.lessons=null;S.L=null;S.error='';render();
 try{const j=await api('listAssignments');S.lessons=j.lessons}catch(e){handleError(e)}
 render();
}
async function openLesson(id){
 Object.assign(S,{screen:'lesson',L:null,draft:null,sub:null,step:1,si:0,showResult:false,submitId:null,error:''});
 Object.assign(SV,{state:'idle',ver:0,savedVer:0,again:false});
 render();window.scrollTo(0,0);
 try{
  const j=await api('getLessonForStudent',{lessonId:id});
  const L=j.lesson;
  const local=lsGet(draftKey(S.auth.studentId,id));
  const resend=!!(local?.pending&&local.answers);
  S.draft=fitA(L,resend?local.answers:(j.draft||j.latest?.answers||null));
  S.sub=j.latest?{answers:fitA(L,j.latest.answers),result:j.latest.result,attempt:j.latest.attempt,submittedAt:j.latest.submittedAt}:null;
  S.L=L;
  if(resend)markDirty();
 }catch(e){handleError(e);if(S.auth)S.screen='list'}
 render();
}
async function backToList(){await flushDraft().catch(()=>{});goList();window.scrollTo(0,0)}
async function submit(){
 if(S.screen==='preview'){S.sub={answers:clone(S.draft),result:localResult(S.L,S.draft),attempt:1,submittedAt:''};S.showResult=true;window.scrollTo(0,0);return render()}
 if(S.submitting)return;
 S.submitting=true;S.error='';clearTimeout(SV.timer);render();
 const id=S.submitId||(S.submitId=uuid());
 const ver=SV.ver,answers=clone(S.draft),sid=S.auth.studentId,lid=S.L.lessonId;
 let j=null,err=null;
 for(let i=0;i<3&&!j;i++){
  try{j=await api('submit',{lessonId:lid,submissionId:id,answers})}
  catch(e){err=e;if(e.code)break;await new Promise(r=>setTimeout(r,1500))}
 }
 S.submitting=false;
 if(j){
  S.sub={answers:fitA(S.L,j.answers),result:{rate:j.rate,cats:j.cats,marks:j.marks},attempt:j.attempt,submittedAt:j.submittedAt};
  S.submitId=null;S.showResult=true;
  SV.savedVer=Math.max(SV.savedVer,ver);
  if(SV.ver===ver){SV.state='saved';lsSet(draftKey(sid,lid),{answers,pending:false})}
  window.scrollTo(0,0);
 }else if(err){handleError(err)}
 render();
}

/* 講師 */
async function loadTeacher(){
 S.screen='teacher';S.error='';render();
 try{
  if(!S.tLessons){const j=await api('listLessons');S.tLessons=j.lessons}
  if(!S.tLessons.length){S.tData=null;return render()}
  if(!S.tLessons.some(l=>l.lessonId===S.tLessonId))S.tLessonId=S.tLessons[0].lessonId;
  saveLogin();
  const j=await api('listSubmissions',{lessonId:S.tLessonId});
  S.tData=j;
  if(S.tsel&&!j.students.some(s=>s.studentId===S.tsel))S.tsel='';
 }catch(e){handleError(e)}
 render();
}
async function setCheck(id,on){
 if(S.checking)return;
 S.checking=true;S.error='';render();
 try{
  const j=await api(on?'check':'uncheck',{submissionId:id});
  const st=S.tData.students.find(x=>x.latest?.submissionId===id);
  if(st){st.latest.checkedBy=j.checkedBy;st.latest.checkedAt=j.checkedAt}
 }catch(e){handleError(e)}
 S.checking=false;render();
}

function step1(a){

function chunkLine(si,a){
 const s=S.L.sentences[si],n=s.tokens.length,ch=chunksFrom(a.bounds[si],n);let h='';
 ch.forEach((c,ci)=>{
  const k=c[0]+'-'+c[1],role=a.roles[si][k]||'';
  h+=`<span class="chunk"><span class="cw">`;
  for(let t=c[0];t<=c[1];t++){
   h+=`<span class="w">${esc(s.tokens[t].w)}${t===n-1?esc(s.end):''}</span>`;
   if(t<c[1])h+=`<button class="gap" data-act="gap" data-s="${si}" data-g="${t}" aria-label="${esc(s.tokens[t].w)} のあとで区切る"></button>`;
  }
  h+=`</span><button class="role ${role?'set':''}" data-act="role" data-s="${si}" data-k="${k}" data-r="${role}">${role||'選ぶ'}</button></span>`;
  if(ci<ch.length-1)h+=`<button class="gap on" data-act="gap" data-s="${si}" data-g="${c[1]}" aria-label="区切りを外す"></button>`;
 });

}

/* ===== 共通：見直し表示 ===== */
/* J.pos(si,ti,答え) / J.chunk(si,from,to,役割) で ○✗ を決める。J.fix / J.keyline は講師だけ。 */
function reviewLine(L,si,a,J){
 const s=L.sentences[si],n=s.tokens.length,ch=chunksFrom(a.bounds[si],n);let allOk=true,h='<div class="rv">';
 ch.forEach(c=>{
  const role=a.roles[si][c[0]+'-'+c[1]]||'',cok=J.chunk(si,c[0],c[1],role);if(!cok)allOk=false;
  h+=`<span class="chunk view ${cok?'':'bad'}"><span class="cw">`;
  for(let t=c[0];t<=c[1];t++){
   const p=a.pos[si][t],ok=J.pos(si,t,p),q=a.q[si+'-'+t];
   h+=`<span class="wd static ${p?'has':''} ${ok?'':'bad'}" style="--c:${p?posVar(p):'var(--line)'}"><span class="en">${esc(s.tokens[t].w)}${t===n-1?esc(s.end):''}</span><span class="pl">${p?posName(p):'未'}${ok?'':J.fix?`<b class="fix">→${J.fix(si,t)}</b>`:'<b class="x">✗</b>'}</span>${q?'<span class="qb">？</span>':''}</span>`;
  }
  h+=`</span><span class="role static ${cok?'':'bad'}" data-r="${esc(role)}">${esc(role)||'未'}${cok?'':' ✗'}</span></span>`;
 });
 h+='</div>';
 if(J.keyline){if(ch.length!==s.chunks.length)allOk=false;if(!allOk)h+=J.keyline(si)}
 return h;
}
function meaningTable(list,teacher){

}

function grade(L,a){
 const items=[];
 L.sentences.forEach((s,si)=>{
  s.tokens.forEach((tk,ti)=>items.push({cat:'品詞',s:si,t:ti,ok:posOk(tk,a.pos[si][ti]),key:tk.pos}));
  const ch=chunksFrom(a.bounds[si],s.tokens.length);
  s.chunks.forEach(c=>{const has=ch.some(x=>x[0]===c.from&&x[1]===c.to);const role=a.roles[si][c.from+'-'+c.to];items.push({cat:'かたまり',s:si,a:c.from,b:c.to,ok:has&&role===c.role,key:c.role,why:c.why})});
 });
 L.words.forEach(w=>{const v=(a.meanings[w.w]||'').trim();items.push({cat:'意味',w:w.w,ok:!!v&&(w.ok||[]).some(k=>v.includes(k)),ans:v,key:w.example||(w.ok||[])[0]||'',why:w.why})});
 const by=c=>{const f=items.filter(i=>i.cat===c);return{n:f.length,hit:f.filter(i=>i.ok).length}};
 const hit=items.filter(i=>i.ok).length;
 return{items,rate:items.length?Math.round(hit/items.length*100):0,cats:{意味:by('意味'),かたまり:by('かたまり'),品詞:by('品詞')}};
}

  keyline:si=>`<p class="keyline">正しい区切り：${L.sentences[si].chunks.map(c=>`[${esc(words(L,si,c.from,c.to))}]<sub>${esc(c.role)}</sub>`).join(' ')}</p>`
 };

function classInsight(L,subs){
 const tot={},miss={},qs={};
 subs.forEach(({g,r})=>{
  g.items.filter(i=>i.cat==='品詞').forEach(i=>{tot[i.key]=(tot[i.key]||0)+1;if(!i.ok)miss[i.key]=(miss[i.key]||0)+1});
  Object.keys(r.answers.q).forEach(k=>{const[s,t]=k.split('-').map(Number);const w=L.sentences[s]?.tokens[t]?.w;if(w)qs[w]=(qs[w]||0)+1});
 });
 const bars=Object.keys(tot).map(k=>({k,r:Math.round((miss[k]||0)/tot[k]*100)})).sort((x,y)=>y.r-x.r);
 const qlist=Object.entries(qs).sort((x,y)=>y[1]-x[1]);
 return `<div class="grid2"><div class="card"><h2>品詞ごとのまちがい率</h2>${bars.map(b=>`<div class="hb"><span>${posName(b.k)}</span><span class="bar"><i class="${b.r>30?'low':''}" style="width:${b.r}%"></i></span><span>${b.r}%</span></div>`).join('')||'<p class="muted">提出がありません</p>'}</div>
 <div class="card"><h2>？が付いた単語</h2>${qlist.length?`<div class="chips">${qlist.map(([w,n])=>`<span class="chip">${esc(w)}<span>${n}</span></span>`).join('')}</div><p class="muted">複数の生徒が？を付けた単語は、文法の時間の導入に使えます。</p>`:'<p class="muted">？はまだありません</p>'}</div></div>`;
}
function scaffolds(L,a,g){
 const out=[];
 Object.keys(a.q).forEach(k=>{const[s,t]=k.split('-').map(Number);const w=L.sentences[s]?.tokens[t]?.w;if(w)out.push(`「${w}」に？。答えを言う前に「この単語は文の中で何をしている？」と聞き、自分の言葉で説明してもらう`)});
 g.items.filter(i=>i.cat==='かたまり'&&!i.ok).slice(0,2).forEach(i=>{out.push(`[${words(L,i.s,i.a,i.b)}]（正：${i.key}）。「どこからどこまでが一つの意味？」と区切りを考えさせる`)});
 const miss={};g.items.filter(i=>i.cat==='品詞'&&!i.ok).forEach(i=>miss[i.key]=(miss[i.key]||0)+1);
 const top=Object.entries(miss).sort((x,y)=>y[1]-x[1])[0];
 if(top&&top[1]>=2)out.push(`${posName(top[0])}を${top[1]}回まちがえている。同じ品詞の例文を2〜3個見せて、共通点を本人に見つけてもらう`);
 return out.slice(0,5);
}
function mistakes(L,a){
 const g=grade(L,a),bySent=L.sentences.map(()=>[]),mean=[];
 g.items.forEach(i=>{
  if(i.ok)return;
  if(i.cat==='品詞'){
   const tk=L.sentences[i.s].tokens[i.t],ans=a.pos[i.s][i.t],pw=POS_WHY[i.key]||{};
   bySent[i.s].push({type:'品詞',order:i.t+.5,target:tk.w,ans:ans?posName(ans):'未入力',key:posName(i.key)+((tk.alt||[]).length?`（${tk.alt.map(posName).join('・')}でも正解）`:''),
    why:tk.why||pw.why||'',ask:pw.ask||'',q:!!a.q[i.s+'-'+i.t]});
  }else if(i.cat==='かたまり'){
   const sx=L.sentences[i.s];
   const ov=chunksFrom(a.bounds[i.s],sx.tokens.length).filter(c=>c[1]>=i.a&&c[0]<=i.b);
   const ans=ov.map(c=>`[${words(L,i.s,c[0],c[1])}] ${a.roles[i.s][c[0]+'-'+c[1]]||'未'}`).join('　');
   bySent[i.s].push({type:'かたまり',order:i.a,target:`[${words(L,i.s,i.a,i.b)}]`,ans,key:`[${words(L,i.s,i.a,i.b)}] ${i.key}`,
    why:i.why||ROLE_WHY[i.key]||'',ask:ROLE_ASK[i.key]||'',q:false});
  }else{
   mean.push({type:'意味',target:i.w,ans:i.ans||'未入力',key:i.key,why:i.why||'本文の中で合う意味を選ぶ。',ask:'「この文の中だと、どんな意味になりそう？」と聞く'});
  }
 });
 bySent.forEach(l=>l.sort((x,y)=>x.order-y.order));
 return{g,bySent,mean};
}

function detailView(L,id){

const srcLine=s=>s?`<p class="src">${esc(s)}</p>`:'';

/* ===== 教室長画面 ===== */
/* レッスン JSON のまちがいを日本語で返す（gas/Code.gs の lessonErrors と同じ決まり） */
const POS_KEYS=POS.map(p=>p.k),ROLES=ROLE_CYCLE.slice(1);
function lessonErrors(L){
 const err=[],add=m=>{if(err.length<30)err.push(m)};
 if(!L||typeof L!=='object'||Array.isArray(L))return['JSON の形が正しくありません（{ } で始まる形にしてください）。'];
 const str=v=>typeof v==='string'&&v.trim()!=='';
 if(!str(L.lessonId)||!/^[A-Za-z0-9_-]{1,40}$/.test(L.lessonId.trim()))add('lessonId は英数字と - _ だけで、40字までにしてください。');
 if(!str(L.title))add('title（レッスンの名前）が入っていません。');
 if(!str(L.grade))add('grade（学年）が入っていません。');
 if(!str(L.source))add('source（出典）が入っていません。出典がないレッスンは保存できません。');
 if(!Array.isArray(L.sentences)||!L.sentences.length){add('sentences（文）が1つもありません。');return err}
 L.sentences.forEach((s,si)=>{
  const at=`文${si+1}`;
  if(!s||!Array.isArray(s.tokens)||!s.tokens.length){add(`${at}：tokens（単語）がありません。`);return}
  const n=s.tokens.length;
  s.tokens.forEach((t,ti)=>{
   const w=`${at}の${ti+1}語目`;
   if(!t||!str(t.w)){add(`${w}：w（単語）がありません。`);return}
   if(!POS_KEYS.includes(t.pos))add(`${w}「${t.w}」：pos「${t.pos??''}」は使えません（${POS_KEYS.join('・')}）。`);
   if(t.alt!==undefined&&(!Array.isArray(t.alt)||t.alt.some(x=>!POS_KEYS.includes(x))))add(`${w}「${t.w}」：alt は品詞の記号の並びにしてください。`);
  });
  if(!Array.isArray(s.chunks)||!s.chunks.length){add(`${at}：chunks（かたまり）がありません。`);return}
  let next=0;
  s.chunks.forEach((c,ci)=>{
   const k=`${at}の${ci+1}番目のかたまり`;
   if(!c||!Number.isInteger(c.from)||!Number.isInteger(c.to)||c.from>c.to){add(`${k}：from / to が正しくありません。`);return}
   if(c.from!==next)add(`${k}：from が ${next} ではありません（かたまりは前から順に、すきまなく並べます）。`);
   if(!ROLES.includes(c.role))add(`${k}：role「${c.role??''}」は使えません（${ROLES.join('・')}）。`);
   next=c.to+1;
  });
  if(next!==n)add(`${at}：かたまりが最後の単語（${n-1}番）まで届いていないか、はみ出しています。`);
 });
 if(L.words!==undefined&&!Array.isArray(L.words))add('words は [ ] の並びにしてください。');
 (Array.isArray(L.words)?L.words:[]).forEach((w,i)=>{
  const k=`意味調べの${i+1}語目`;
  if(!w||!str(w.w)){add(`${k}：w（単語）がありません。`);return}
  if(!Number.isInteger(w.sentence)||!L.sentences[w.sentence])add(`${k}「${w.w}」：sentence は 0〜${L.sentences.length-1} の番号にしてください。`);
  if(!Array.isArray(w.ok)||!w.ok.length||w.ok.some(x=>!str(x)))add(`${k}「${w.w}」：ok（正解にする言葉）を1つ以上入れてください。`);
 });
 return err;
}
/* 貼られた JSON を読んで確かめる。結果は S.aCheck に入れる */
function checkLessonJson(){
 S.aSave=null;
 const t=S.aJson.trim();
 if(!t){S.aCheck={errors:['JSON を貼ってください。']};return S.aCheck}
 let L;
 try{L=JSON.parse(t)}catch(e){S.aCheck={errors:['JSON として読めません。最初の { から最後の } まで、全部コピーできているか確かめてください。']};return S.aCheck}
 const errors=lessonErrors(L);
 S.aCheck=errors.length?{errors}:{lesson:L};
 return S.aCheck;
}
/* 画面で使う形にする（教室長のプレビュー用。答えも入ったまま） */
function viewLesson(L){
 const x=clone(L);
 x.words=Array.isArray(x.words)?x.words:[];x.source=String(x.source||'').trim();
 x.note=[x.textbook,/^\d+$/.test(String(x.unit??''))?`Unit ${x.unit}`:x.unit,/^\d+$/.test(String(x.part??''))?`Part ${x.part}`:x.part].filter(v=>v!==undefined&&v!==null&&String(v).trim()).join(' ');
 x.sentences.forEach(s=>{s.end=s.end||''});
 return x;
}
/* レッスンの正解を、生徒の答えと同じ形にする（正解の色分け表示に使う） */
function keyAnswers(L){
 const a=blankA(L);
 L.sentences.forEach((s,si)=>{
  a.pos[si]=s.tokens.map(t=>t.pos);
  a.bounds[si]=s.chunks.slice(0,-1).map(c=>c.to);
  s.chunks.forEach(c=>{a.roles[si][c.from+'-'+c.to]=c.role});
 });
 L.words.forEach(w=>{a.meanings[w.w]=w.example||(w.ok||[])[0]||''});
 return a;
}
/* プレビューでの採点（gas/Code.gs の studentResult と同じ形） */
function localResult(L,a){
 const g=grade(L,a);
 const tok=L.sentences.map((s,si)=>s.tokens.map((tk,ti)=>posOk(tk,a.pos[si][ti])));
 const grp=L.sentences.map((s,si)=>{const o={};chunksFrom(a.bounds[si],s.tokens.length).forEach(c=>{const k=c[0]+'-'+c[1],kc=s.chunks.find(x=>x.from===c[0]&&x.to===c[1]);o[k]=!!kc&&kc.role===(a.roles[si][k]||'')});return o});
 const mean={};g.items.filter(i=>i.cat==='意味').forEach(i=>{mean[i.w]=i.ok});
 return{rate:g.rate,cats:g.cats,marks:{tok,grp,mean}};
}

 Object.assign(S,{screen:'preview',L,draft:blankA(L),sub:null,step:1,si:0,showResult:false,error:''});
 render();window.scrollTo(0,0);
}

async function saveLesson(overwrite){
 const c=checkLessonJson();if(!c.lesson)return render();
 S.aBusy=true;S.error='';render();
 try{
  const j=await api('upsertLesson',{lesson:c.lesson,overwrite});
  if(j.errors)S.aCheck={errors:j.errors};
  else if(j.exists)S.aSave={exists:true,submissions:j.submissions,lessonId:c.lesson.lessonId};
  else{S.aSave={saved:true,created:j.created,lessonId:j.lessonId};S.aLessonId=j.lessonId;S.aBusy=false;return loadAdmin()}
 }catch(e){handleError(e)}
 S.aBusy=false;render();
}
async function doAssign(on){
 const ids=[...S.aSel];
 if(!S.aLessonId||!ids.length){S.error='レッスンと生徒をえらんでください。';return render()}
 if(!on&&!confirm(`えらんだ ${ids.length} 人の配布を取り消しますか？（下書きと提出は消えません）`))return;
 S.aBusy=true;S.error='';S.aMsg='';render();
 try{
  const j=await api(on?'assign':'unassign',{lessonId:S.aLessonId,studentIds:ids,dueDate:S.aDue});
  S.aMsg=on?`配りました（新しく ${j.added} 人、期限を直した人 ${j.updated} 人）。`:`${j.removed} 人の配布を取り消しました。`;
  S.aSel=new Set();S.aBusy=false;return loadAdmin();
 }catch(e){handleError(e)}
 S.aBusy=false;render();
}

/* ===== 操作 ===== */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const act=el.dataset.act,a=S.draft;
 if(act==='dismiss'){S.error=''}
 else if(act==='logout'){logout();return}
 else if(act==='lrole'){S.form.role=el.dataset.v;S.error=''}
 else if(act==='ccreset'){S.roster=null;S.error=''}
 else if(act==='open'){openLesson(el.dataset.v);return}
 else if(act==='back'){backToList();return}
 else if(act==='step'){S.step=+el.dataset.v;S.si=0;window.scrollTo(0,0)}
 else if(act==='sent'){const v=+el.dataset.v;if(v>=0&&v<S.L.sentences.length)S.si=v}
 else if(act==='gap'){const si=+el.dataset.s,g=+el.dataset.g,b=a.bounds[si];const i=b.indexOf(g);i>=0?b.splice(i,1):b.push(g);markDirty()}
 else if(act==='role'){const si=+el.dataset.s,k=el.dataset.k,c=a.roles[si][k]||'';a.roles[si][k]=ROLE_CYCLE[(ROLE_CYCLE.indexOf(c)+1)%ROLE_CYCLE.length];if(!a.roles[si][k])delete a.roles[si][k];markDirty()}
 else if(act==='tool'){S.tool=el.dataset.v}
 else if(act==='word'){const si=+el.dataset.s,ti=+el.dataset.t,k=si+'-'+ti;
  if(S.tool==='?'){a.q[k]?delete a.q[k]:a.q[k]=1}
  else if(S.tool==='x'){a.pos[si][ti]=null}
  else{a.pos[si][ti]=a.pos[si][ti]===S.tool?null:S.tool}
  markDirty()}
 else if(act==='submit'){submit();return}
 else if(act==='showres'){S.showResult=true}
 else if(act==='retry'){S.showResult=false;S.step=1;window.scrollTo(0,0)}
 else if(act==='trow'){S.tsel=el.dataset.v}
 else if(act==='check'){setCheck(el.dataset.v,true);return}
 else if(act==='uncheck'){setCheck(el.dataset.v,false);return}
 else if(act==='treload'){loadTeacher();return}
 else if(act==='atab'){S.atab=el.dataset.v;S.aMsg=''}
 else if(act==='areload'){loadAdmin();return}
 else if(act==='acheck'){checkLessonJson()}
 else if(act==='apreview'){openPreview();return}
 else if(act==='asave'){saveLesson(false);return}
 else if(act==='aoverwrite'){saveLesson(true);return}
 else if(act==='aload'){loadLessonJson(el.dataset.v);return}
 else if(act==='aclear'){S.aJson='';S.aCheck=null;S.aSave=null}
 else if(act==='pvback'){S.screen='admin';S.L=null;S.draft=null;S.sub=null;window.scrollTo(0,0)}
 else if(act==='agrade'){const on=el.dataset.on==='1';(S.aData?.students||[]).filter(x=>x.grade===el.dataset.v).forEach(x=>on?S.aSel.add(x.studentId):S.aSel.delete(x.studentId))}
 else if(act==='aassign'){doAssign(true);return}
 else if(act==='aunassign'){doAssign(false);return}
 else return;
 render();
});
