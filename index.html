<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本文分析ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F5; --paper:#FFFFFF; --ink:#1C2740; --sub:#5A6680; --line:#CDD5E1; --focus:#2F6FDB;
  --ok:#1F8A5B; --ng:#D33A3A; --soft:#F5F7FA; --warn:#B26A00;
  --p-noun:#2F6FDB; --p-pron:#7A5AF8; --p-verb:#E0464B; --p-aux:#E8710A; --p-adj:#23955F;
  --p-adv:#B58900; --p-prep:#0E93A0; --p-conj:#D6409F; --p-art:#7D8494; --p-intj:#8B5E3C; --p-inf:#5E7D1E; --p-wh:#1E3A8A; --p-ger:#9F1239; --p-etc:#52525B;
  --r-S:#2F6FDB; --r-V:#E0464B; --r-O:#23955F; --r-C:#B58900; --r-M:#7D8494; --r-etc:#52525B;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111722; --paper:#1A2230; --ink:#E6EBF3; --sub:#9AA6BC; --line:#334058; --focus:#7FA8F5;
    --ok:#4CC38A; --ng:#FF6B6B; --soft:#202A3A; --warn:#E3A33B;
    --p-noun:#6E9BF2; --p-pron:#A58BFF; --p-verb:#FF6B6E; --p-aux:#FF9A3D; --p-adj:#4CC38A;
    --p-adv:#E3B83B; --p-prep:#3CC3CF; --p-conj:#F06BBE; --p-art:#A3AAB8; --p-intj:#D2A47C; --p-inf:#A8CB5E; --p-wh:#A5B8FF; --p-ger:#FF8FA8; --p-etc:#C4C4CC;
    --r-S:#6E9BF2; --r-V:#FF6B6E; --r-O:#4CC38A; --r-C:#E3B83B; --r-M:#A3AAB8; --r-etc:#8E8E99;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111722; --paper:#1A2230; --ink:#E6EBF3; --sub:#9AA6BC; --line:#334058; --focus:#7FA8F5;
  --ok:#4CC38A; --ng:#FF6B6B; --soft:#202A3A; --warn:#E3A33B;
  --p-noun:#6E9BF2; --p-pron:#A58BFF; --p-verb:#FF6B6E; --p-aux:#FF9A3D; --p-adj:#4CC38A;
  --p-adv:#E3B83B; --p-prep:#3CC3CF; --p-conj:#F06BBE; --p-art:#A3AAB8; --p-intj:#D2A47C; --p-inf:#A8CB5E; --p-wh:#A5B8FF; --p-ger:#FF8FA8; --p-etc:#C4C4CC;
  --r-S:#6E9BF2; --r-V:#FF6B6E; --r-O:#4CC38A; --r-C:#E3B83B; --r-M:#A3AAB8; --r-etc:#8E8E99;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:16px;line-height:1.7}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.en,.w{font-family:"Literata",Georgia,"Times New Roman",serif}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.hin{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:1.05rem}
.brand small{font-weight:400;color:var(--sub);margin-left:8px;font-size:.8rem}
.modes{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.modes button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:500;color:var(--sub)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.unit{margin:0;color:var(--sub);font-size:.9rem}
.tag{margin-left:8px;font-size:.75rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
h1{margin:2px 0 0;font-size:1.7rem;line-height:1.3}
h2{font-size:1.15rem;margin:0 0 8px}
.who{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--sub)}
select,input[type=text],input[type=password],textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.steps button{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left}
.steps .num{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:700;font-size:.85rem}
.steps .lab{font-weight:700}
.steps .cnt{margin-left:auto;color:var(--sub);font-size:.8rem}
.steps button[aria-current="step"]{border-color:var(--ink)}
.steps button[aria-current="step"] .num{background:var(--ink);color:var(--paper)}
@media (max-width:600px){.steps .cnt{display:none}.steps button{flex-direction:column;gap:2px;text-align:center}.steps .lab{font-size:.85rem}}

.guide{background:var(--paper);border-left:5px solid var(--ink);padding:10px 14px;border-radius:0 8px 8px 0;margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--sub);margin:-4px 0 14px}
.legend b{display:inline-block;min-width:2.2em;text-align:center;border-radius:4px;color:#fff;padding:0 4px;margin-right:4px}
.banner{background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem}
.linkbtn{border:0;background:none;color:var(--focus);text-decoration:underline;padding:0 4px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.sno{font-size:.8rem;color:var(--sub);margin-bottom:6px}

/* 意味調べ */
.mrow{display:grid;grid-template-columns:1fr minmax(160px,260px);gap:12px;align-items:center}
.mrow .en{font-size:1.35rem;font-weight:600}
.ctx{margin:0;color:var(--sub);font-size:.95rem;font-family:"Literata",Georgia,serif}
.ctx b{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}

/* かたまり */
.line{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:16px;column-gap:0}
.chunk{display:inline-flex;flex-direction:column;align-items:center}
.cw{display:flex;align-items:stretch;border:2px solid var(--ink);border-top:0;border-radius:0 0 10px 10px;padding:0 6px 2px;min-height:44px}
.w{font-size:1.35rem;padding:4px 2px;align-self:center;white-space:nowrap}
.gap{width:20px;min-height:44px;border:0;background:none;padding:0;position:relative}
.gap::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--line)}
.gap:hover::after{background:var(--focus)}
.gap.on{width:22px;align-self:stretch;min-height:44px}
.gap.on::after{width:2px;height:70%;margin:0 0 0 -1px;top:15%;border-radius:1px;background:var(--focus)}
.role{margin-top:6px;border:1.5px dashed var(--sub);background:var(--paper);border-radius:999px;padding:1px 12px;font-size:.85rem;min-width:56px;min-height:40px;font-weight:700;color:var(--sub)}
.role.set,.role.static{border-style:solid;color:#fff;border-color:transparent}
/* 見直しの表示のラベル（span）も、ボタンと同じく文字を真ん中にする */
.role.static{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.role[data-r="S"]{background:var(--r-S)}.role[data-r="V"]{background:var(--r-V)}.role[data-r="O"]{background:var(--r-O)}.role[data-r="C"]{background:var(--r-C)}.role[data-r="修飾"]{background:var(--r-M)}.role[data-r="つなぎ"]{background:var(--p-conj)}.role[data-r="その他"]{background:var(--r-etc)}
.role.static[data-r=""]{background:var(--soft);color:var(--sub);border:1.5px dashed var(--sub)}
.dot{color:var(--ink);font-size:1.35rem;align-self:flex-start;padding-top:6px;font-family:"Literata",serif}

/* 品詞 */
.palwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,58px));z-index:4;background:var(--bg);padding:8px 0 8px;margin-bottom:6px}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal-ex{margin:6px 0 0;font-size:.88rem;line-height:1.5;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.pal-ex b{margin-right:2px}
@media (max-width:600px){
 .palette{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;-webkit-overflow-scrolling:touch}
 .palette button{padding:6px 8px}
}
.palette button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font-weight:500;min-height:44px}
.palette i{width:14px;height:14px;border-radius:3px;background:var(--c)}
.palette button[aria-pressed="true"]{border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 1.5px var(--c,var(--ink));font-weight:700}
.palette .qt{--c:var(--warn)}
.palette .xt{--c:var(--sub)}
.wline{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:flex-end}
.wd{position:relative;display:inline-flex;flex-direction:column;align-items:center;border:0;background:none;padding:4px 6px 2px;border-bottom:5px solid var(--c);border-radius:6px 6px 0 0;min-width:44px}
.wd.has{background:color-mix(in srgb,var(--c) 14%,transparent)}
.wd .en{font-size:1.35rem;line-height:1.3;white-space:nowrap}
.wd.gl{margin-left:-3px}
.wd .pl{font-size:.72rem;color:var(--c);font-weight:700;min-height:1.1em;white-space:nowrap}
.wd:not(.has) .pl{color:var(--sub)}
.qb{position:absolute;top:-8px;right:-6px;background:var(--warn);color:#fff;border-radius:50%;width:20px;height:20px;font-size:.75rem;display:grid;place-items:center;font-weight:700}
.end{font-family:"Literata",serif;font-size:1.35rem;align-self:center}

/* 提出 */
.check{list-style:none;padding:0;margin:0 0 12px}
.check li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.check .ng{color:var(--warn);font-weight:700}
.check .ok{color:var(--ok);font-weight:700}
textarea{width:100%;min-height:80px}
.primary{background:var(--ink);color:var(--paper);border:0;border-radius:10px;padding:12px 22px;font-weight:700;font-size:1.05rem}
.secondary{background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:10px 18px;font-weight:700}

/* 結果 */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score .big{font-size:3rem;font-weight:700;line-height:1}
.score .big small{font-size:1.1rem}
.cats{display:flex;gap:16px;flex-wrap:wrap;font-size:.9rem;color:var(--sub)}
.cats b{color:var(--ink)}
.rv{display:flex;flex-wrap:wrap;row-gap:12px;column-gap:8px;align-items:flex-start}
.chunk.view .cw{padding:0 4px 2px;gap:2px;align-items:flex-end}
.chunk.view.bad .cw{border-color:var(--ng)}
.wd.static{cursor:default}
.wd.static.bad{border-bottom-style:double;border-bottom-color:var(--ng)}
.x{color:var(--ng);margin-left:2px}
.fix{color:var(--ng);margin-left:4px}
.role.static.bad{outline:2px solid var(--ng);outline-offset:1px}
.keyline{margin:10px 0 0;font-size:.9rem;color:var(--sub);font-family:"Literata",serif}
.keyline sub{font-family:"Zen Maru Gothic",sans-serif;color:var(--ink);font-weight:700;margin-right:6px}
.mlist{width:100%;border-collapse:collapse;font-size:.95rem}
.mlist td{padding:6px 4px;border-bottom:1px solid var(--line)}
.okc{color:var(--ok);font-weight:700}.ngc{color:var(--ng);font-weight:700}

/* 講師画面 */
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px}
.stats div{font-size:.85rem;color:var(--sub)}
.stats b{display:block;font-size:1.3rem;color:var(--ink)}
.tw{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
table.roster{width:100%;border-collapse:collapse;min-width:680px;font-size:.92rem}
.roster th{text-align:left;font-weight:500;color:var(--sub);font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line)}
.roster td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.roster tr.row{cursor:pointer}
.roster tr.row:hover td{background:var(--soft)}
.roster tr.sel td{background:color-mix(in srgb,var(--focus) 10%,transparent)}
.st{font-size:.8rem;border-radius:4px;padding:2px 8px;white-space:nowrap}
.st.none{background:var(--soft);color:var(--sub)}
.st.wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);font-weight:700}
.st.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-weight:700}
.bar{position:relative;display:inline-block;width:110px;height:8px;background:var(--soft);border-radius:4px;vertical-align:middle;margin-right:8px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--ok)}
.bar i.low{background:var(--ng)}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.hb{display:grid;grid-template-columns:5.5em 1fr 3em;align-items:center;gap:8px;font-size:.88rem;margin:4px 0}
.hb .bar{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.9rem;font-family:"Literata",serif}
.chip span{font-family:"Zen Maru Gothic",sans-serif;color:var(--warn);font-weight:700;margin-left:4px}
.detail h2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.scaf{margin:0;padding-left:1.2em}
.scaf li{margin:4px 0}
.memo{background:var(--soft);border-radius:8px;padding:8px 12px;margin:0}
.checkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub);font-size:.88rem}
.snav{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.snav button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;min-height:44px;font-weight:500}
.snav button.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.snav button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card.big{padding:22px 18px}
.card.big .w,.card.big .wd .en,.card.big .end{font-size:1.65rem}
.card.big .wd{min-width:52px;padding:6px 8px 3px}
.card.big .wline{gap:12px 6px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.pager button[disabled]{opacity:.35;cursor:default}
.sech{margin:22px 0 6px}
.mcount{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.88rem;margin-top:6px}
.mcount span:not(:first-child){border-radius:4px;padding:1px 8px;font-weight:700}
.t-品詞{background:color-mix(in srgb,var(--p-verb) 15%,transparent);color:var(--p-verb)}
.t-かたまり{background:color-mix(in srgb,var(--p-noun) 15%,transparent);color:var(--p-noun)}
.t-意味{background:color-mix(in srgb,var(--p-adj) 15%,transparent);color:var(--p-adj)}
.msent{font-family:"Literata",Georgia,serif;font-size:1.25rem;margin:2px 0 10px;line-height:2}
.msent .bp{color:var(--ng);font-weight:600}
.msent .bc{text-decoration:underline dashed var(--p-noun);text-decoration-thickness:2px;text-underline-offset:6px}
.msent.small{font-size:.95rem;margin:0;color:var(--sub);line-height:1.5}
.okrow{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:10px 16px}
.okrow .sno{margin:0}
.mks{display:grid;gap:10px}
.mk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
.mk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mk-h .en{font-size:1.15rem}
.mk-type{font-size:.75rem;font-weight:700;border-radius:4px;padding:1px 8px}
.qtag{font-size:.75rem;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:0 6px}
.mk-ans{display:flex;gap:6px 18px;flex-wrap:wrap;margin:6px 0 4px;font-size:.95rem}
.mk-ans .was{color:var(--ng);text-decoration:line-through;text-decoration-thickness:1px}
.mk-ans .right{color:var(--ok);font-weight:700}
.why,.ask{margin:4px 0 0;font-size:.92rem;display:grid;grid-template-columns:4em 1fr;gap:6px}
.why b,.ask b{color:var(--sub);font-weight:500;font-size:.82rem;padding-top:2px}
details.card summary{cursor:pointer;font-weight:700}
.foot{margin-top:28px;font-size:.82rem;color:var(--sub)}
.foot button{margin-left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== 本番版で足したもの ===== */
.hright{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--sub);flex-wrap:wrap;justify-content:flex-end}
.hright .linkbtn{min-height:44px}
.savest{font-size:.8rem}
.savest.err{color:var(--ng);font-weight:700}
.login{max-width:460px;margin:24px auto}
.login h1{margin-bottom:8px}
.login label{display:block;margin:14px 0 4px;font-weight:700}
.login input,.login select{width:100%;min-height:44px}
.login .modes{display:inline-flex;margin-top:6px}
.login .modes button{min-height:44px;padding:6px 22px}
.login .primary{width:100%;margin-top:18px;min-height:48px}
.banner.err{border:1px solid var(--ng);color:var(--ng);background:color-mix(in srgb,var(--ng) 8%,var(--paper));margin:0 0 12px}
.lcard{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:12px;min-height:64px;font:inherit}
.lcard b{display:block;font-size:1.1rem}
.lcard .unit{font-size:.82rem}
.tctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tctl .secondary{min-height:44px}
.loading{padding:30px 0;text-align:center}
button[disabled]{opacity:.5;cursor:default}

/* ===== v2 で足したもの ===== */
.src{margin:0;color:var(--sub);font-size:.78rem;line-height:1.5}
.lcard .src{display:block;margin-top:2px}
.login .modes{flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 18px;min-height:44px;font-weight:700;color:var(--sub)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.jsonbox{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem;line-height:1.5}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btnrow .primary,.btnrow .secondary{min-height:44px}
.errlist{margin:6px 0 0;padding-left:1.2em;color:var(--ng)}
.errlist li{margin:2px 0}
.okmsg{color:var(--ok);font-weight:700}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .secondary{min-height:44px;flex:none}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;font-weight:700}
.field select,.field input{min-height:44px;font-weight:400}
.sgrade{margin:12px 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sgrade h3{margin:0;font-size:1rem}
.sgrade .linkbtn{min-height:44px}

<body>
<header><div class="hin">
  <div class="brand">本文分析ノート<small>v5</small></div>
  <div class="hright" id="hright"></div>
</div></header>
<main id="main"></main>

<script>
/* ===== 設定 ===== */
const VERSION=5;
/* ↓ GAS を「ウェブアプリ」として公開したときの URL を ' ' の間に貼る（docs/setup.md 手順7） */
const API_URL='https://script.google.com/macros/s/AKfycbxUiT8hdHzK3Ol4ZKZJT1hFNnyWGQolkUCGVA3amXMKUl_dXqweX0BrD6XMpVfs9Q_j/exec';

const POS=[
 {k:'名',name:'名詞',v:'--p-noun'},{k:'代',name:'代名詞',v:'--p-pron'},{k:'動',name:'動詞',v:'--p-verb'},
 {k:'助',name:'助動詞',v:'--p-aux'},{k:'冠',name:'冠詞',v:'--p-art'},{k:'疑',name:'疑問詞',v:'--p-wh'},
 {k:'動名',name:'動名詞',v:'--p-ger'},{k:'不',name:'不定詞',v:'--p-inf'},{k:'形',name:'形容詞',v:'--p-adj'},
 {k:'副',name:'副詞',v:'--p-adv'},{k:'前',name:'前置詞',v:'--p-prep'},{k:'接',name:'接続詞',v:'--p-conj'},
 {k:'間',name:'間投詞',v:'--p-intj'},{k:'その他',name:'その他',v:'--p-etc'}
];
const ROLE_CYCLE=['','S','V','O','C','修飾','その他'];
const ROLE_LEGEND={'S':['--r-S','主語「〜は」'],'V':['--r-V','動詞「〜する」'],'O':['--r-O','目的語「〜を」'],'C':['--r-C','Sの説明'],'修飾':['--r-M','くわしくする部分'],'その他':['--r-etc','それ以外の部分'],'つなぎ':['--p-conj','but など']};
/* そのレッスンで使う品詞・役割（posSet / roleSet）。v2 までのレッスンには無いので、そのときは全部 */
const posSetOf=L=>Array.isArray(L?.posSet)&&L.posSet.length?POS.filter(p=>L.posSet.includes(p.k)):POS;
const roleSetOf=L=>Array.isArray(L?.roleSet)&&L.roleSet.length?L.roleSet:ROLE_CYCLE.slice(1);
/* 講師用：品詞・役割ごとの共通の理由と聞き方（レッスンに why がないときに使う） */
const POS_WHY={
 '名':{why:'人・物・場所・時などの名前を表す語。',ask:'「これは何かの名前？」と聞く'},
 '代':{why:'名詞のかわりに使う語（he, she, her など）。',ask:'「この単語は誰のこと？」と聞く'},
 '動':{why:'動作や状態を表し、文の中心（V）になる語。',ask:'「この文で『〜する』『〜だ』にあたる語はどれ？」と聞く'},
 '助':{why:'動詞の前に置いて意味を足す語（can, will など）。後ろに動詞の原形が来る。',ask:'「すぐ後ろに動詞がある？」と聞く'},
 '形':{why:'名詞をくわしくする語。be動詞の後ろでSの様子を説明することもある。',ask:'「どの名詞をくわしくしている？」と聞く'},
 '副':{why:'動詞・形容詞・他の副詞をくわしくする語。名詞はくわしくしない。',ask:'「この語がくわしくしているのは名詞？それ以外？」と聞く'},
 '前':{why:'名詞の前に置いて、場所・時・関係を表す語。後ろの名詞とセットでかたまりを作る。',ask:'「後ろにどんな名詞が続いている？」と聞く'},
 '接':{why:'語と語、文と文をつなぐ語（and, but など）。',ask:'「何と何をつないでいる？」と聞く'},
 '冠':{why:'a / an / the の3語だけが冠詞。名詞の前に付いて「1つの」「その」を表す。',ask:'「冠詞の仲間は何語ある？」と聞く'},
 '間':{why:'oh, wow, yes, hi など、気持ちや返事・あいさつを表す語。文の他の語とは結びつかない。',ask:'「この語がなくても、文の意味は伝わる？」と聞く'},
 '疑':{why:'what, who, where, how など、たずねるときに使う語。ふつう文の最初に来る。',ask:'「この文は何をたずねている？どの語でたずねている？」と聞く'},
 '動名':{why:'動詞に -ing を付けて「〜すること」の意味にし、名詞のように使う形。',ask:'「この -ing は『〜している』？それとも『〜すること』？」と聞く'},
 '不':{why:'「to＋動詞の原形」の形。「〜すること」「〜するために」などの意味になる。前置詞の to とちがい、すぐ後ろに動詞が来る。',ask:'「to のすぐ後ろは名詞？動詞？」と聞く'},
 'その他':{why:'このレッスンで使う品詞のどれにもあてはまらない語。',ask:'「ボタンにある品詞のどれかにあてはまる？」と聞く'}
};
const ROLE_WHY={'S':'「〜は・〜が」にあたる主語。','V':'動作や状態を表す動詞。','O':'動詞のあとで「〜を・〜に」にあたる目的語。','C':'Sの様子や正体を説明する補語。S＝C が成り立つ。','修飾':'時・場所・様子などをくわしくする部分。なくても文は成り立つ。','つなぎ':'文と文、語と語をつなぐ部分（and, but など）。','その他':'このレッスンで使う役割（S・V など）のどれにもあてはまらない部分。'};
const ROLE_ASK={'S':'「この文は誰（何）の話？」と聞く','V':'「動作や状態を表す語はどれ？」と聞く','O':'「動詞のあとに『何を？』と聞くと、答えはどこ？」と聞く','C':'「S＝この部分、と言える？」と聞く','修飾':'「このかたまりがなくても文は成り立つ？」と聞く','つなぎ':'「この語は前の文とどうつながっている？」と聞く','その他':'「この部分は S？V？それともどちらでもない？」と聞く'};

/* ===== 小さな道具 ===== */
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const posOf=k=>POS.find(p=>p.k===k);
const posName=k=>posOf(k)?.name||'';
const posVar=k=>posOf(k)?`var(${posOf(k).v})`:'var(--line)';
const posOk=(tk,v)=>!!v&&(v===tk.pos||(tk.alt||[]).includes(v));
const jt=toks=>toks.map((t,i)=>(i&&!t.glue?' ':'')+t.w+(t.punct||'')).join('');
/* 単語のすぐ後ろの記号（カンマなど）と、文の話し手 */
const pn=t=>esc(t.punct||'');
const spk=s=>s.speaker?`<div class="spk">${esc(s.speaker)}</div>`:'';
const spkIn=s=>s.speaker?`<span class="spk-in">${esc(s.speaker)}</span>`:'';
/* かたまりの中の単語（カンマなどの記号は付けない） */
const words=(L,si,a,b)=>L.sentences[si].tokens.slice(a,b+1).map((t,i)=>(i&&!t.glue?' ':'')+t.w).join('');
/* サーバーの日時「2026/10/20 13:05:00」→「10/20 13:05」 */
const fmt=s=>{const m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/.exec(String(s||''));if(!m)return String(s||'');return `${+m[2]}/${+m[3]}${m[4]?` ${m[4].padStart(2,'0')}:${m[5]}`:''}`};
const fmtDate=s=>{const m=/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/.exec(String(s||''));return m?`${+m[2]}/${+m[3]}`:String(s||'')};
const uuid=()=>{try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12)+'-'+Math.random().toString(36).slice(2,12)};

const LOGIN_KEY='honbun-check-login';
const draftKey=(sid,lid)=>`honbun-check-draft:${sid}:${lid}`;
function lsGet(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ===== 通信 ===== */
async function api(action,payload={}){
 if(!API_URL)throw new Error('API_URL が設定されていません。');
 const body=Object.assign({action,classCode:S.classCode},S.auth?.token?{token:S.auth.token}:{},payload);
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
 let res;
 try{res=await fetch(API_URL,{method:'POST',body:JSON.stringify(body),signal:ctl.signal})}
 catch(e){throw new Error('通信できませんでした。インターネットにつながっているか確かめて、もう一度ためしてください。')}
 finally{clearTimeout(tm)}
 let j;
 try{j=await res.json()}catch(e){throw new Error('サーバーからの返事が読めませんでした。少し待ってからもう一度ためしてください。')}
 if(j.status!=='ok'){const err=new Error(j.message||'エラーが起きました。');err.code=j.code||'';throw err}
 return j;
}

/* ===== 状態 ===== */
const S={
 classCode:'',roster:null,form:{cc:'',role:'student',sid:'',pin:'',tname:'',pass:'',apass:''},auth:null,screen:'login',busy:false,error:'',
 lessons:null,L:null,draft:null,sub:null,step:1,si:0,tool:'名',showResult:false,submitting:false,submitId:null,
 tLessons:null,tLessonId:'',tData:null,tsel:'',checking:false,
 /* 教室長画面 */
 atab:'lesson',aData:null,aJson:'',aCheck:null,aSave:null,aBusy:false,aMsg:'',aLessonId:'',aDue:'',aSel:new Set(),aIllMsg:'',
 /* 意味調べ（v4） */
 ill:{id:'',status:'',imgs:[]},tap:'',posEx:true,
 /* v5：◯✕ の記録（chk：宿題 ／ rt：解き直し）。mode は 'main'（宿題）か 'retry'（解き直し） */
 chk:null,rt:null,mode:'main',rdraft:null,chkBusy:'',total:0,latest:null
};
const SV={state:'idle',ver:0,savedVer:0,timer:null,inflight:null,again:false};
function saveLogin(){lsSet(LOGIN_KEY,{classCode:S.classCode,auth:S.auth,tLessonId:S.tLessonId})}

function handleError(e){
 if(e.code==='class'||(e.code==='auth'&&S.auth)){logout(e.message);return}
 S.error=e.message;
}

/* ===== 答えの形 ===== */
function blankA(L){return{meanings:{},bounds:L.sentences.map(()=>[]),roles:L.sentences.map(()=>({})),pos:L.sentences.map(s=>s.tokens.map(()=>null)),q:{},memo:''}}
function fitA(L,a){
 const b=blankA(L);a=a||{};
 b.meanings=Object.assign({},a.meanings);b.q=Object.assign({},a.q);b.memo=String(a.memo||'');
 L.sentences.forEach((s,si)=>{
  b.bounds[si]=Array.isArray(a.bounds?.[si])?a.bounds[si].slice():[];
  b.roles[si]=Object.assign({},a.roles?.[si]);
  const p=a.pos?.[si]||[];b.pos[si]=s.tokens.map((_,ti)=>p[ti]||null);
 });
 return b;
}
function chunksFrom(bounds,n){
 const b=[...new Set(bounds)].sort((x,y)=>x-y);const out=[];let st=0;
 for(const g of b){if(g>=st&&g<n-1){out.push([st,g]);st=g+1}}
 out.push([st,n-1]);return out;
}
/* 決まった問題の数／問題の数（手順のボタンに出す） */
function progressCounts(){
 const L=S.L,R=recNow()||{items:{}};
 const keysOf=c=>S.mode==='retry'?S.rt.targets.filter(k=>k[0]===c):null;
 const fmtc=(c,total)=>{const ks=keysOf(c);const n=ks?ks.length:total;const d=ks?ks.filter(k=>R.items[k]?.r).length:Object.entries(R.items).filter(([k,it])=>k[0]===c&&it.r).length;return n?`${d}/${n}`:'－'};
 const tokens=L.sentences.reduce((t,s)=>t+s.tokens.length,0);
 return{m:fmtc('m',L.words.length),p:fmtc('p',tokens),c:fmtc('c',Math.max(0,S.total-L.words.length-tokens))};
}
function counts(L,a){
 let r=0,rn=0,p=0,pn=0;
 L.sentences.forEach((s,si)=>{const ch=chunksFrom(a.bounds[si],s.tokens.length);rn+=ch.length;r+=ch.filter(c=>a.roles[si][c[0]+'-'+c[1]]).length;pn+=s.tokens.length;p+=a.pos[si].filter(Boolean).length});
 const m=L.words.filter(w=>(a.meanings[w.w]||'').trim()).length;
 return{m,mn:L.words.length,r,rn,p,pn};
}

/* ===== 下書きの自動保存 ===== */
function markDirty(){
 if(S.screen==='preview')return;
 SV.ver++;SV.state='dirty';S.submitId=null;
 lsSet(draftKey(S.auth.studentId,S.L.lessonId),{answers:S.draft,pending:true});
 clearTimeout(SV.timer);SV.timer=setTimeout(flushDraft,3000);
 updateSaveState();
}
function flushDraft(){
 clearTimeout(SV.timer);SV.timer=null;
 if(S.auth?.role!=='student'||!S.L||SV.ver===SV.savedVer)return Promise.resolve();
 if(SV.inflight){SV.again=true;return SV.inflight}
 const ver=SV.ver,answers=clone(S.draft),sid=S.auth.studentId,lid=S.L.lessonId;
 SV.state='saving';updateSaveState();
 SV.inflight=(async()=>{
  try{
   await api('saveDraft',{lessonId:lid,answers});
   SV.savedVer=Math.max(SV.savedVer,ver);
   if(SV.ver===ver){SV.state='saved';lsSet(draftKey(sid,lid),{answers,pending:false})}else SV.state='dirty';
  }catch(e){
   SV.state='error';
   if(e.code){handleError(e);render()}else SV.timer=setTimeout(flushDraft,10000);
  }finally{
   SV.inflight=null;updateSaveState();
   if(SV.again){SV.again=false;if(SV.ver!==SV.savedVer)flushDraft()}
  }
 })();
 return SV.inflight;
}
function beaconFlush(){
 if(S.auth?.role==='student'&&S.L&&SV.ver!==SV.savedVer&&API_URL&&navigator.sendBeacon){
  navigator.sendBeacon(API_URL,JSON.stringify({action:'saveDraft',classCode:S.classCode,token:S.auth.token,lessonId:S.L.lessonId,answers:S.draft}));
 }
}
function updateSaveState(){
 const el=document.getElementById('savest');if(!el)return;
 const on=S.screen==='lesson'&&S.L;
 el.textContent=!on?'':{idle:'',dirty:'入力中…',saving:'保存中…',saved:'保存しました ✓',error:'保存できませんでした。自動でやり直します'}[SV.state];
 el.className='savest'+(SV.state==='error'?' err':'');
}

/* ===== 画面の流れ ===== */
async function start(){
 const saved=lsGet(LOGIN_KEY)||{};
 S.classCode=saved.classCode||'';S.form.cc=S.classCode;S.tLessonId=saved.tLessonId||'';
 if(saved.auth?.token&&API_URL){
  S.auth=saved.auth;S.classCode=saved.auth.classCode||S.classCode;
  if(S.auth.role==='student')return goList();
  if(S.auth.role==='admin')return loadAdmin();
  return loadTeacher();
 }
 render();
}
async function logout(msg){
 if(S.auth?.role==='student')await flushDraft().catch(()=>{});

/* 生徒・講師・教室長のログイン。合えば通行証（token）をもらって保存する */
async function doLogin(role){
 const f=S.form;let payload;
 if(role==='student'){
  if(!f.sid.trim()||!/^\d{4}$/.test(f.pin.trim())){S.error='生徒番号と、4けたの PIN を入れてください。';return render()}
  payload={role,studentId:f.sid.trim(),pin:f.pin.trim()};
 }else if(role==='teacher'){
  if(!f.tname){S.error='講師の名前を選んでください。';return render()}
  payload={role,teacherName:f.tname,password:f.pass.trim()};
 }else payload={role,password:f.apass.trim()};
 S.busy=true;S.error='';render();
 try{
  const j=await api('login',payload);
  S.auth=role==='student'?{role,classCode:S.classCode,token:j.token,studentId:j.studentId,name:j.name}
   :role==='teacher'?{role,classCode:S.classCode,token:j.token,teacherName:j.teacherName}
   :{role,classCode:S.classCode,token:j.token};
  f.pin='';f.pass='';f.apass='';saveLogin();S.busy=false;
  return role==='student'?goList():role==='teacher'?loadTeacher():loadAdmin();
 }catch(e){S.error=e.message;if(e.code==='class')S.roster=null}
 S.busy=false;render();
}

/* ===== v5：1問ずつ確かめる ===== */
const MARK={o:'◯',t:'△',x:'✕'};
const REF={know:'知らなかった',careless:'うっかり',think:'考え方がちがった'};
const recNow=()=>S.mode==='retry'?S.rt:S.chk;
const ansNow=()=>S.mode==='retry'?S.rdraft:S.draft;
const isTarget=k=>S.mode!=='retry'||S.rt.targets.includes(k);
const itemOf=k=>recNow()?.items?.[k];
const unitOfKey=k=>k[0]==='m'?k:k.split(':').slice(0,2).join(':');
const markBadge=r=>r?`<span class="rmk r-${r}" aria-label="${{o:'正解',t:'△',x:'おしい'}[r]}">${MARK[r]}</span>`:'';
/* ◯ のときの、小さく喜べる一言（問題ごとに決まった言葉を出す） */
const CHEERS=['やったね！','いいね！','その調子！','すばらしい！','ばっちり！'];
const cheer=k=>CHEERS[[...String(k)].reduce((t,c)=>t+c.charCodeAt(0),0)%CHEERS.length];
function meanFixed(w,it,a){return it.r!=='x'||(it.ok||[]).some(k=>(a.meanings[w]||'').includes(k))}
function posFixed(si,ti,it,a){const v=a.pos[si][ti];return it.r!=='x'||v===it.ans||(it.alt||[]).includes(v)}
function chunkFixed(it,a){
 if(it.r!=='x')return true;
 const n=S.L.sentences[it.si].tokens.length;
 return chunksFrom(a.bounds[it.si],n).some(c=>c[0]===it.from&&c[1]===it.to)&&a.roles[it.si][it.from+'-'+it.to]===it.role;
}
function itemFixed(k,it,a){
 if(k[0]==='m')return meanFixed(k.slice(2),it,a);
 if(k[0]==='p'){const[,si,ti]=k.split(':').map(Number);return posFixed(si,ti,it,a)}
 return chunkFixed(it,a);
}
/* 書きかえられない所 */
function tokLocked(si,ti){
 const k=`p:${si}:${ti}`;if(!isTarget(k))return true;
 const it=itemOf(k);if(!it||!it.r)return false;
 return it.r!=='x'||posFixed(si,ti,it,ansNow());
}
function meanLocked(w){
 const k='m:'+w;if(!isTarget(k))return true;
 const it=itemOf(k);if(!it||!it.r)return false;
 return it.r!=='x'||meanFixed(w,it,ansNow());
}
function lockedChunks(si){
 const out=[],a=ansNow();
 Object.entries(recNow()?.items||{}).forEach(([k,it])=>{if(k.startsWith(`c:${si}:`)&&it.r&&chunkFixed(it,a))out.push(it)});
 if(S.mode==='retry')(S.rt.prefill.chunks[si]||[]).forEach(c=>out.push(c));
 return out;
}
const gapLocked=(si,g)=>lockedChunks(si).some(c=>(c.from<=g&&g<c.to)||g===c.to||g===c.from-1);
const roleLocked=(si,k)=>lockedChunks(si).some(c=>c.from+'-'+c.to===k);
/* まとまり（m:単語 ／ p:文 ／ c:文）の状態：none（問題なし）・todo（まだ確かめていない）・fix（✕ を直す所が残っている）・done */
function unitHasTarget(u){
 if(S.mode!=='retry')return true;
 return S.rt.targets.some(k=>unitOfKey(k)===u);
}
function unitState(u){
 if(!unitHasTarget(u))return 'none';
 const R=recNow();if(!R)return 'todo';
 if(!(R.done||[]).includes(u))return 'todo';
 const a=ansNow();
 const bad=Object.entries(R.items).some(([k,it])=>unitOfKey(k)===u&&it.r==='x'&&!itemFixed(k,it,a));
 return bad?'fix':'done';
}
function xBox(k,it,ansHtml,fixed){
 return `<div class="xbox"><p><span class="oshii">おしい！</span>正解は ${ansHtml}</p>${it.why?`<p class="muted">わけ：${esc(it.why)}</p>`:''}
 ${fixed?'<p class="okc">直せたね ✓</p>':'<p class="fixmsg">正解のとおりに直してみよう。</p>'}
 <div class="refl"><span>どうしてかな？（えらばなくても進めます）</span>${Object.entries(REF).map(([f,lab])=>`<button class="${it.f===f?'on':''}" data-act="refl" data-k="${esc(k)}" data-f="${f}">${lab}</button>`).join('')}</div></div>`;
}
function ckBtn(kind,arg,label){
 const u=kind==='mean'?'m:'+arg:(kind==='pos'?'p:':'c:')+arg,busy=S.chkBusy===u;
 return `<button class="primary ck" data-act="ck" data-kind="${kind}" data-v="${esc(arg)}" ${S.chkBusy?'disabled':''}>${busy?'確かめています…':label}</button>`;
}
async function doCheck(kind,arg){
 if(S.chkBusy)return;
 const u=kind==='mean'?'m:'+arg:(kind==='pos'?'p:':'c:')+arg;
 S.chkBusy=u;S.error='';render();
 try{
  const payload={lessonId:S.L.lessonId,kind,answers:ansNow(),mode:S.mode};
  if(kind==='mean')payload.w=arg;else payload.si=+arg;
  const j=S.screen==='preview'?localCheck(payload):await api('checkItem',payload);
  const R=recNow();
  Object.assign(R.items,j.items);
  R.done=R.done||[];if(j.done&&!R.done.includes(u))R.done.push(u);
  if(j.progress){R.rate=j.progress.rate;R.cats=j.progress.cats}
  if(S.mode==='retry'&&j.finishedAt)S.rt.finishedAt=j.finishedAt;
  if(S.screen!=='preview')markDirty();
 }catch(e){handleError(e)}
 S.chkBusy='';render();
}
async function doReflect(k,f){
 const it=itemOf(k);if(!it)return;
 const before=it.f;it.f=f;render();
 if(S.screen==='preview')return;
 try{await api('reflect',{lessonId:S.L.lessonId,key:k,f,mode:S.mode});markDirty()}
 catch(e){it.f=before;handleError(e);render()}
}
/* 解き直し */
function buildRetryDraft(){
 const L=S.L,a=blankA(L),R=S.rt;
 Object.entries(R.prefill.pos).forEach(([k,v])=>{const[si,ti]=k.split(':').map(Number);a.pos[si][ti]=v});
 L.sentences.forEach((s,si)=>{
  const list=(R.prefill.chunks[si]||[]).concat(Object.entries(R.items).filter(([k,it])=>k.startsWith(`c:${si}:`)&&it.r).map(([,it])=>it));
  const b=new Set();
  list.forEach(c=>{if(c.from>0)b.add(c.from-1);if(c.to<s.tokens.length-1)b.add(c.to);a.roles[si][c.from+'-'+c.to]=c.role});
  a.bounds[si]=[...b];
 });
 Object.entries(R.items).forEach(([k,it])=>{if(k[0]==='p'&&it.r){const[,si,ti]=k.split(':').map(Number);a.pos[si][ti]=it.ans}});
 return a;
}
function firstRetryStep(){
 const t=S.rt.targets;
 if(t.some(k=>k[0]==='m'))return 1;
 if(t.some(k=>k[0]==='c'))return 2;
 return 3;
}
function enterRetry(){
 S.mode='retry';S.rdraft=buildRetryDraft();S.showResult=false;S.step=firstRetryStep();S.si=retrySents(S.step===2?'c':'p')[0]??0;window.scrollTo(0,0);
}
async function startRetry(){
 S.busy=true;S.error='';render();
 try{const j=await api('startRetry',{lessonId:S.L.lessonId});S.rt=j.retry;enterRetry()}catch(e){handleError(e)}
 S.busy=false;render();
}
const retrySents=kind=>S.L.sentences.map((_,si)=>si).filter(si=>unitHasTarget(kind+':'+si));
/* 教室長のプレビュー：GAS を使わずに、同じ決まりで確かめる（教室長は答えを持っているので） */
function localCheck(q){
 const L=S.L,R=S.chk,full=S.pvFull=S.pvFull||{},a=q.answers,items={};
 const judge=(k,ok)=>{const it=full[k]=full[k]||{};if(!it.r)it.r=ok?'o':'x';return it};
 const pub=(k,it,extra)=>Object.assign({r:it.r},it.r==='x'?extra:{},it.r&&k[0]==='p'?{ans:extra.ans}:{},k[0]==='c'&&it.r?{si:extra.si,from:extra.from,to:extra.to,role:extra.role}:{});
 let unit;
 if(q.kind==='mean'){
  const w=L.words.find(x=>x.w===q.w),k='m:'+w.w;unit=k;
  const v=(a.meanings[w.w]||'').trim(),it=judge(k,!!v&&(w.ok||[]).some(o=>v.includes(o)));
  items[k]=pub(k,it,{ans:w.example||(w.ok||[])[0]||'',ok:w.ok||[],why:w.why||''});
 }else if(q.kind==='pos'){
  const si=q.si,s=L.sentences[si];unit='p:'+si;
  s.tokens.forEach((tk,ti)=>{const k=`p:${si}:${ti}`,v=a.pos[si][ti]||'',it=judge(k,posOk(tk,v));items[k]=pub(k,it,{ans:tk.pos,alt:tk.alt||[],why:tk.why||''})});
 }else{
  const si=q.si,s=L.sentences[si];unit='c:'+si;
  const mine=chunksFrom(a.bounds[si],s.tokens.length).map(c=>({from:c[0],to:c[1],role:a.roles[si][c[0]+'-'+c[1]]||''}));
  s.chunks.forEach(c=>{const k=`c:${si}:${c.from}-${c.to}`,same=mine.find(m=>m.from===c.from&&m.to===c.to);
   const it=judge(k,!!same&&same.role===c.role);
   items[k]=pub(k,it,{si,from:c.from,to:c.to,role:c.role,why:c.why||''});
  });
 }
 const keys=[...L.words.map(w=>'m:'+w.w),...L.sentences.flatMap((s,si)=>[...s.chunks.map(c=>`c:${si}:${c.from}-${c.to}`),...s.tokens.map((_,ti)=>`p:${si}:${ti}`)])];
 const uk=k=>unitOfKey(k);
 const done=keys.filter(k=>uk(k)===unit).every(k=>full[k]?.r);
 const cats={};['意味','かたまり','品詞'].forEach(c=>cats[c]={n:0,hit:0,o:0,t:0,x:0});
 let o=0;keys.forEach(k=>{const c=cats[k[0]==='m'?'意味':k[0]==='c'?'かたまり':'品詞'],r=full[k]?.r;c.n++;if(r==='o'){c.o++;c.hit++;o++}else if(r==='t')c.t++;else if(r==='x')c.x++});
 return{unit,items,done,progress:{rate:Math.round(o/keys.length*100),cats}};
}

function listView(){

 if(!S.lessons)return h+loadingView();

  return `<button class="card lcard" data-act="open" data-v="${esc(l.lessonId)}"><span><span class="unit">${esc(l.note)}</span><b>${esc(l.title)}</b>${l.source?`<span class="src">${esc(l.source)}</span>`:''}${l.dueDate?`<span class="muted">期限 ${esc(fmtDate(l.dueDate))}</span>`:''}</span>${st}</button>`;
 }).join('');

function studentView(){
 const L=S.L,a=ansNow(),r=S.latest;
 const pv=S.screen==='preview';
 let h=pv?`<div class="pvbar"><p class="banner" style="margin:0">プレビュー中です。生徒にはこう見えます。入力しても保存されません。</p><button class="secondary" data-act="pvback">教室長画面にもどる</button></div>`:'';
 h+=`<section class="lhead"><div><p class="unit">${esc(L.title)}${L.note?`<span class="tag">${esc(L.note)}</span>`:''}</p>${srcLine(L.source)}<h1>本文分析ノート</h1></div>
 ${pv?'':'<button class="secondary" data-act="back">一覧にもどる</button>'}</section>`;
 if(r&&S.showResult)return h+resultView(r);
 if(!recNow())return h+loadingView();
 const c=progressCounts();
 const steps=S.mode==='retry'?[['意味調べ',c.m],['かたまり',c.c],['品詞',c.p],['おわり','']]:[['意味調べ',c.m],['かたまり',c.c],['品詞',c.p],['提出','']];

/* 品詞の例（posSet にある品詞だけ出す） */

}

/* 問題の名前（生徒・講師に見せる文字） */
function itemLabel(L,k){

 if(k[0]==='p')return `<b class="en">${esc(L.sentences[+si].tokens[+rest].w)}</b><span class="muted">（文${+si+1}）</span>`;
 const[f,t]=rest.split('-').map(Number);
 return `<b class="en">[${esc(words(L,+si,f,t))}]</b><span class="muted">（文${+si+1}）</span>`;
}

   <p style="margin:6px 0 0"><button class="primary" data-act="contretry">${R.finishedAt?'見直す':'続きをする'}</button> <button class="secondary" data-act="startretry" ${S.busy?'disabled':''}>はじめから解き直す</button></p></div>`;

function resultViewOld(r){

 const J={pos:(si,ti)=>!!M.tok[si]?.[ti],chunk:(si,x,y)=>M.grp[si]?.[x+'-'+y]===true};
 L.sentences.forEach((s,si)=>{h+=`<div class="card"><div class="sno">文 ${si+1}</div>${reviewLine(L,si,a,J)}</div>`});

}

/* ===== 共通：見直し表示 ===== */
/* J.pos(si,ti,答え) / J.chunk(si,from,to,役割) で ○✗ を決める。J.fix / J.keyline は講師だけ。 */
function reviewLine(L,si,a,J){
 const s=L.sentences[si],n=s.tokens.length,ch=chunksFrom(a.bounds[si],n);let allOk=true,h=spk(s)+'<div class="rv">';
 ch.forEach(c=>{
  const role=a.roles[si][c[0]+'-'+c[1]]||'',cok=J.chunk(si,c[0],c[1],role);if(!cok)allOk=false;
  h+=`<span class="chunk view ${cok?'':'bad'}"><span class="cw">`;
  for(let t=c[0];t<=c[1];t++){
   const p=a.pos[si][t],ok=J.pos(si,t,p),q=a.q[si+'-'+t];
   h+=`<span class="wd static ${p?'has':''} ${ok?'':'bad'}" style="--c:${p?posVar(p):'var(--line)'}"><span class="en">${esc(s.tokens[t].w)}${pn(s.tokens[t])}${t===n-1?esc(s.end):''}</span><span class="pl">${p?posName(p):'未'}${ok?'':J.fix?`<b class="fix">→${J.fix(si,t)}</b>`:'<b class="x">✗</b>'}</span>${q?'<span class="qb">？</span>':''}</span>`;
  }
  h+=`</span><span class="role static ${cok?'':'bad'}" data-r="${esc(role)}">${esc(role)||'未'}${cok?'':' ✗'}</span></span>`;
 });
 h+='</div>';
 if(J.keyline){if(ch.length!==s.chunks.length)allOk=false;if(!allOk)h+=J.keyline(si)}
 return h;
}
function meaningTable(list,teacher){
 return `<div class="card"><h2>意味調べ</h2><table class="mlist">${list.map(i=>`<tr><td class="en" style="font-size:1.1rem">${esc(i.w)}</td><td>${esc(i.ans)||'<span class="muted">未入力</span>'}</td><td>${i.ok?'<span class="okc">✓</span>':'<span class="ngc">✗</span>'}${!i.ok&&teacher?` <span class="muted">例：${esc(i.key)}</span>`:''}</td></tr>`).join('')}</table></div>`;
}

/* ===== 講師画面 ===== */
function grade(L,a){
 const items=[];
 L.sentences.forEach((s,si)=>{
  s.tokens.forEach((tk,ti)=>items.push({cat:'品詞',s:si,t:ti,ok:posOk(tk,a.pos[si][ti]),key:tk.pos}));
  const ch=chunksFrom(a.bounds[si],s.tokens.length);
  s.chunks.forEach(c=>{const has=ch.some(x=>x[0]===c.from&&x[1]===c.to);const role=a.roles[si][c.from+'-'+c.to];items.push({cat:'かたまり',s:si,a:c.from,b:c.to,ok:has&&role===c.role,key:c.role,why:c.why})});
 });
 L.words.forEach(w=>{const v=(a.meanings[w.w]||'').trim();items.push({cat:'意味',w:w.w,ok:!!v&&(w.ok||[]).some(k=>v.includes(k)),ans:v,key:w.example||(w.ok||[])[0]||'',why:w.why})});
 const by=c=>{const f=items.filter(i=>i.cat===c);return{n:f.length,hit:f.filter(i=>i.ok).length}};
 const hit=items.filter(i=>i.ok).length;
 return{items,rate:items.length?Math.round(hit/items.length*100):0,cats:{意味:by('意味'),かたまり:by('かたまり'),品詞:by('品詞')}};
}
function teacherJudge(L){
 return{
  pos:(si,ti,p)=>posOk(L.sentences[si].tokens[ti],p),
  chunk:(si,x,y,role)=>L.sentences[si].chunks.some(c=>c.from===x&&c.to===y&&c.role===role),
  fix:(si,ti)=>posName(L.sentences[si].tokens[ti].pos),
  keyline:si=>`<p class="keyline">正しい区切り：${L.sentences[si].chunks.map(c=>`[${esc(words(L,si,c.from,c.to))}]<sub>${esc(c.role)}</sub>`).join(' ')}</p>`
 };
}

 <div class="tctl">${ls.length?`<label class="who">レッスン<select data-in="tlesson">${ls.map(l=>`<option value="${esc(l.lessonId)}" ${l.lessonId===S.tLessonId?'selected':''}>${esc(l.grade)} ${esc(l.title)}</option>`).join('')}</select></label>`:''}
 <button class="secondary" data-act="treload">最新にする</button></div></section>`;
 if(S.tLessons&&!ls.length)return h+`<div class="card"><p>レッスンがまだ登録されていません。教室長画面の「レッスン登録」から入れてください。</p></div>`;
 if(!T||T.lesson.lessonId!==S.tLessonId)return h+loadingView();
 const L=T.lesson;
 /* v5 の提出（checks あり）は、◯ の割合をそのまま使う。v4 までの提出は、今までどおりその場で採点する */
 const rows=T.students.map(s=>{const r=s.latest;const g=r?(r.checks?{rate:r.rate,cats:r.cats,v5:true}:grade(L,r.answers)):null;return{s,r,g}});
 const subs=rows.filter(x=>x.g);

 const chk=subs.filter(x=>x.r.checkedAt).length;

 h+=`<div class="stats"><div>提出<b>${subs.length} / ${rows.length}人</b></div><div>平均正答率（◯の割合）<b>${avg}%</b></div><div>講師チェック済み<b>${chk} / ${subs.length}人</b></div><div>？の数<b>${qn}個</b></div></div>
 <div class="tw"><table class="roster"><thead><tr><th>生徒</th><th>状況</th><th>正答率（◯の割合・線＝70%）</th><th>◯ ✕</th><th>解き直し</th><th>？</th><th>チェック</th></tr></thead><tbody>`;
 if(!rows.length)h+=`<tr><td colspan="7" class="muted">このレッスンを配られた生徒がいません。教室長画面の「宿題の配布」で配ってください。</td></tr>`;
 rows.forEach(({s,r,g})=>{
  const st=!g?'<span class="st none">未提出</span>':r.checkedAt?'<span class="st done">チェック済み</span>':'<span class="st wait">チェック待ち</span>';
  h+=`<tr class="row ${S.tsel===s.studentId?'sel':''}" data-act="trow" data-v="${esc(s.studentId)}" tabindex="0"><td><b>${esc(s.name)}</b></td><td>${st}</td>
  <td>${g?`<span class="bar"><i class="${g.rate<70?'low':''}" style="width:${g.rate}%"></i><em style="left:70%"></em></span>${g.rate}%`:'<span class="muted">－</span>'}</td>
  <td>${g?.v5?oxtTotal(g.cats):g?Object.values(g.cats).map(v=>`${v.hit}/${v.n}`).join('　'):draftProgress(L,s)}</td>
  <td>${retryCell(s)}</td>
  <td>${g?Object.keys(r.answers.q).length:'－'}</td>
  <td class="muted">${r?.checkedAt?`${esc(fmt(r.checkedAt))}<br>${esc(r.checkedBy)}`:''}</td></tr>`;
 });
 h+=`</tbody></table></div>`;
 h+=classInsight(L,subs);
 h+=teacherLines(L);
 if(S.tsel)h+=detailView(L,S.tsel);
 h+=`<p class="foot">${esc(fmt(T.loadedAt))} の時点の情報です。<button class="secondary" data-act="treload">最新にする</button></p>`;

}
/* ◯✕ の合計（試作の △ が残っていれば小さく出す） */
function oxtTotal(cats){
 const c={o:0,t:0,x:0};Object.values(cats||{}).forEach(v=>{c.o+=v.o||0;c.t+=v.t||0;c.x+=v.x||0});
 return `<span class="okc">◯${c.o}</span> <span class="ngc">✕${c.x}</span>${c.t?` <span class="muted">△${c.t}</span>`:''}`;
}
/* まだ提出していない生徒の進み具合（確かめた問題の数） */
function draftProgress(L,s){
 const it=s.draft?.checks?.items;if(!it)return '<span class="muted">－</span>';
 const d=Object.values(it).filter(x=>x.r).length;
 return `<span class="muted">確かめた ${d}/${s.total||'?'}</span>`;
}
/* 解き直しの結果 */
function retryCell(s){
 const R=s.draft?.retry;if(!R?.targets)return '<span class="muted">－</span>';
 const c={o:0,t:0,x:0};R.targets.forEach(k=>{const r=R.items?.[k]?.r;if(r)c[r]++});
 return `◯${c.o}/${R.targets.length}${R.finishedAt?'':' <span class="muted">（とちゅう）</span>'}`;
}
function classInsight(L,subs){
 if(subs.some(x=>x.g.v5))return classInsightV5(L,subs);
 const tot={},miss={},qs={};
 subs.forEach(({g,r})=>{
  g.items.filter(i=>i.cat==='品詞').forEach(i=>{tot[i.key]=(tot[i.key]||0)+1;if(!i.ok)miss[i.key]=(miss[i.key]||0)+1});
  Object.keys(r.answers.q).forEach(k=>{const[s,t]=k.split('-').map(Number);const w=L.sentences[s]?.tokens[t]?.w;if(w)qs[w]=(qs[w]||0)+1});
 });
 const bars=Object.keys(tot).map(k=>({k,r:Math.round((miss[k]||0)/tot[k]*100)})).sort((x,y)=>y.r-x.r);
 const qlist=Object.entries(qs).sort((x,y)=>y[1]-x[1]);
 return `<div class="grid2"><div class="card"><h2>品詞ごとのまちがい率</h2>${bars.map(b=>`<div class="hb"><span>${posName(b.k)}</span><span class="bar"><i class="${b.r>30?'low':''}" style="width:${b.r}%"></i></span><span>${b.r}%</span></div>`).join('')||'<p class="muted">提出がありません</p>'}</div>
 <div class="card"><h2>？が付いた単語</h2>${qlist.length?`<div class="chips">${qlist.map(([w,n])=>`<span class="chip">${esc(w)}<span>${n}</span></span>`).join('')}</div><p class="muted">複数の生徒が？を付けた単語は、文法の時間の導入に使えます。</p>`:'<p class="muted">？はまだありません</p>'}</div></div>`;
}
/* クラス全体（v5）：品詞ごとの「1回目でまちがえた割合」と、みんながつまずいた問題 */
function classInsightV5(L,subs){
 const tot={},miss={},qs={},hard={};
 subs.forEach(({r})=>{
  const items=r.checks?.items||{};
  L.sentences.forEach((s,si)=>s.tokens.forEach((tk,ti)=>{const it=items[`p:${si}:${ti}`];if(!it?.r)return;tot[tk.pos]=(tot[tk.pos]||0)+1;if(it.r!=='o')miss[tk.pos]=(miss[tk.pos]||0)+1}));
  Object.entries(items).forEach(([k,it])=>{if(it.r==='t'||it.r==='x'){const h=hard[k]=hard[k]||{t:0,x:0};h[it.r]++}});
  Object.keys(r.answers.q).forEach(k=>{const[s,t]=k.split('-').map(Number);const w=L.sentences[s]?.tokens[t]?.w;if(w)qs[w]=(qs[w]||0)+1});
 });
 const bars=Object.keys(tot).map(k=>({k,r:Math.round((miss[k]||0)/tot[k]*100)})).sort((x,y)=>y.r-x.r);
 const top=Object.entries(hard).sort((a,b)=>(b[1].x*2+b[1].t)-(a[1].x*2+a[1].t)).slice(0,8);
 const qlist=Object.entries(qs).sort((x,y)=>y[1]-x[1]);
 return `<div class="card"><h2>みんながつまずいた問題</h2>${top.length?`<ul class="olist">${top.map(([k,c])=>`<li><span class="tagf">${k[0]==='m'?'意味':k[0]==='c'?'かたまり':'品詞'}</span>${itemLabel(L,k)}<span class="ngc">✕${c.x+c.t}人</span></li>`).join('')}</ul><p class="muted">✕ が多い順です。授業の最初に、どの文を扱うかを決めるのに使えます。</p>`:'<p class="muted">✕ はまだありません</p>'}</div>
 <div class="grid2"><div class="card"><h2>品詞ごとの ✕ の割合</h2>${bars.map(b=>`<div class="hb"><span>${posName(b.k)}</span><span class="bar"><i class="${b.r>30?'low':''}" style="width:${b.r}%"></i></span><span>${b.r}%</span></div>`).join('')||'<p class="muted">提出がありません</p>'}</div>
 <div class="card"><h2>？が付いた単語</h2>${qlist.length?`<div class="chips">${qlist.map(([w,n])=>`<span class="chip">${esc(w)}<span>${n}</span></span>`).join('')}</div><p class="muted">複数の生徒が？を付けた単語は、文法の時間の導入に使えます。</p>`:'<p class="muted">？はまだありません</p>'}</div></div>`;
}
/* v5：問題ごとの 答え・正解・理由・聞き方 */
function ansText(L,k,v){
 if(v===undefined||v===null||v==='')return '未入力';
 if(k[0]==='m')return String(v);
 if(k[0]==='p')return posName(v)||'未入力';
 const si=+k.split(':')[1];
 return (Array.isArray(v)?v:[]).map(c=>`[${words(L,si,c.from,c.to)}] ${c.role||'未'}`).join('　')||'未入力';
}
function keyInfo(L,k){
 if(k[0]==='m'){const w=L.words.find(x=>'m:'+x.w===k)||{};return{key:w.example||(w.ok||[])[0]||'',why:w.why||'本文の中で合う意味を選ぶ。',ask:'「この文の中だと、どんな意味になりそう？」と聞く'}}
 const[,si,rest]=k.split(':');
 if(k[0]==='p'){const tk=L.sentences[+si].tokens[+rest],pw=POS_WHY[tk.pos]||{};return{key:posName(tk.pos)+((tk.alt||[]).length?`（${tk.alt.map(posName).join('・')}でも正解）`:''),why:tk.why||pw.why||'',ask:pw.ask||''}}
 const[f,t]=rest.split('-').map(Number),c=L.sentences[+si].chunks.find(x=>x.from===f&&x.to===t)||{};
 return{key:`[${words(L,+si,f,t)}] ${c.role}`,why:c.why||ROLE_WHY[c.role]||'',ask:ROLE_ASK[c.role]||''};
}
function oxtItem(L,k,it,rt){
 const ki=keyInfo(L,k),type=k[0]==='m'?'意味':k[0]==='c'?'かたまり':'品詞';
 return `<div class="mk"><div class="mk-h">${markBadge(it.r)}<span class="mk-type t-${type}">${type}</span>${itemLabel(L,k)}${it.f?`<span class="qtag" style="color:var(--ng);border-color:var(--ng)">ふり返り：${REF[it.f]}</span>`:''}${rt?.r?`<span class="tagf">解き直し ${MARK[rt.r]}</span>`:''}</div>
 <div class="tries"><span class="was">生徒：${esc(ansText(L,k,it.a1))}</span><span class="right">正解：${esc(ki.key)}</span></div>
 <p class="why"><b>理由</b>${esc(ki.why)}</p><p class="ask"><b>聞き方</b>${esc(ki.ask)}</p></div>`;
}
/* v5：授業で聞くこと（✕ → ？ の順） */
function scaffoldsV5(L,r){
 const items=r.checks?.items||{},out=[];
 /* 文字だけの名前（ここでは esc をあとでまとめてかけるので、HTML にしない） */
 const lab=k=>{if(k[0]==='m')return k.slice(2);const[,si,rest]=k.split(':');if(k[0]==='p')return `${L.sentences[+si].tokens[+rest].w}（文${+si+1}）`;const[f,t]=rest.split('-').map(Number);return `[${words(L,+si,f,t)}]（文${+si+1}）`};
 ['x','t'].forEach(m=>Object.entries(items).filter(([,it])=>it.r===m).forEach(([k,it])=>{
  const ki=keyInfo(L,k);
  out.push(`${MARK[m]} ${lab(k)}${it.f?`（ふり返り：${REF[it.f]}）`:''}。${ki.ask||'「どう考えた？」と聞き、自分の言葉で説明してもらう'}`);
 }));
 Object.keys(r.answers.q).forEach(k=>{const[s,t]=k.split('-').map(Number);const w=L.sentences[s]?.tokens[t]?.w;if(w)out.push(`？ 「${w}」に？。答えを言う前に「この単語は文の中で何をしている？」と聞く`)});
 return out.slice(0,8);
}
function detailViewV5(L,st){
 const r=st.latest,items=r.checks.items||{},rt=st.draft?.retry,dis=S.checking?'disabled':'',sc=scaffoldsV5(L,r);
 const C=r.cats||{};

function lineErrors(L, add) {
 const str = v => typeof v === 'string' && v.trim() !== '';

 const wordList = (Array.isArray(L.words) ? L.words : []).map(w => (w && typeof w.w === 'string' ? w.w.toLowerCase() : ''));
 // 新出単語の文（words の sentence）。書きこむ欄（new）は、この文のせりふだけ
 const wordSent = (Array.isArray(L.words) ? L.words : []).map(w => (w ? w.sentence : undefined));
 const newSeen = {};
 let nextSentence = 0;
 L.lines.forEach((l, li) => {
  const at = `せりふ${li + 1}`;
  if (!l || !str(l.text)) { add(`${at}：text（英語の文）がありません。`); return; }
  if (!str(l.ja)) add(`${at}：ja（日本語訳）がありません。`);
  if (l.speaker !== undefined && (typeof l.speaker !== 'string' || l.speaker.length > 30)) add(`${at}：speaker（話し手）は30字までの文字にしてください。`);
  if (l.sentence !== undefined) {
   if (!Number.isInteger(l.sentence) || !L.sentences[l.sentence]) add(`${at}：sentence は 0〜${L.sentences.length - 1} の番号にしてください。`);
   else if (l.sentence !== nextSentence) add(`${at}：sentence が ${nextSentence} ではありません（分析する文は、sentences の順番どおりに1回ずつ）。`);
   else nextSentence++;
  }
  if (!Array.isArray(l.gloss) || !l.gloss.length) { add(`${at}：gloss（単語の意味）がありません。`); return; }
  let pos = 0;
  const marks = [];
  String(l.ja || '').replace(/\{([^:{}]+):[^{}]*\}/g, (m, k) => { marks.push(k); return m; });
  l.gloss.forEach((g, gi) => {
   if (!g || !str(g.w)) { add(`${at}の${gi + 1}語目：w がありません。`); return; }
   const p = l.text.indexOf(g.w, pos);
   if (p < 0) add(`${at}の「${g.w}」：text の中に、この順番で見つかりません。`);
   else pos = p + g.w.length;
   const wi = wordList.indexOf(g.w.toLowerCase());
   if (g.new || g.hide) {
    const kind = g.new ? 'new' : 'hide';
    if (g.new && g.hide) add(`${at}の「${g.w}」：new と hide は、どちらか1つにしてください。`);
    if (wi < 0) add(`${at}の「${g.w}」：${kind} なのに words に入っていません。`);
    else if (g.new && l.sentence !== wordSent[wi]) add(`${at}の「${g.w}」：new（書きこむ欄）にできるのは、words の sentence（文${wordSent[wi] + 1}）のせりふだけです。ほかのせりふで同じ意味なら hide にしてください。`);
    else if (g.hide && l.sentence === wordSent[wi]) add(`${at}の「${g.w}」：words の sentence のせりふなので、hide ではなく new にしてください。`);
    if (g.ja !== undefined) add(`${at}の「${g.w}」：新出単語には ja を書かないでください（答えになるため）。`);
    if (marks.indexOf(g.w) < 0) add(`${at}の「${g.w}」：ja の中に {${g.w}:訳} の印がありません（訳の答えを隠すため）。`);
    if (g.otherMeaning) add(`${at}の「${g.w}」：${kind} と otherMeaning は、いっしょに付けられません。`);
    if (g.new && wi >= 0) newSeen[wordList[wi]] = true;
   } else {
    if (!str(g.ja)) add(`${at}の「${g.w}」：ja（その文の中での意味）がありません。`);
    if (wi >= 0 && !g.otherMeaning) add(`${at}の「${g.w}」：新出単語と同じつづりです。同じ意味なら hide（答えを隠す）、意味がちがう決まった言い方なら otherMeaning を付けてください。`);
    if (wi < 0 && g.otherMeaning) add(`${at}の「${g.w}」：otherMeaning は、新出単語と同じつづりの単語にだけ付けます。`);
   }
  });

  if(s.speaker!==undefined&&(typeof s.speaker!=='string'||s.speaker.length>30))add(`${at}：speaker（話し手）は30字までの文字にしてください。`);
  s.tokens.forEach((t,ti)=>{
   const w=`${at}の${ti+1}語目`;
   if(!t||!str(t.w)){add(`${w}：w（単語）がありません。`);return}
   if(t.punct!==undefined&&(typeof t.punct!=='string'||!/^[^\s]{1,3}$/.test(t.punct)))add(`${w}「${t.w}」：punct は「,」のような3字までの記号にしてください。`);

   else if(posSet&&!posSet.includes(t.pos))add(`${w}「${t.w}」：pos「${t.pos}」が posSet に入っていません（生徒のボタンに出ないので、正解できません）。`);
   if(t.alt!==undefined&&(!Array.isArray(t.alt)||t.alt.some(x=>!POS_KEYS.includes(x))))add(`${w}「${t.w}」：alt は品詞の記号の並びにしてください。`);
  });

  let next=0;
  s.chunks.forEach((c,ci)=>{
   const k=`${at}の${ci+1}番目のかたまり`;
   if(!c||!Number.isInteger(c.from)||!Number.isInteger(c.to)||c.from>c.to){add(`${k}：from / to が正しくありません。`);return}
   if(c.from!==next)add(`${k}：from が ${next} ではありません（かたまりは前から順に、すきまなく並べます）。`);
   if(!ROLES.includes(c.role))add(`${k}：role「${c.role??''}」は使えません（${ROLES.join('・')}）。`);
   else if(roleSet&&!roleSet.includes(c.role))add(`${k}：role「${c.role}」が roleSet に入っていません（生徒のボタンに出ないので、正解できません）。`);

  });
  if(next!==n)add(`${at}：かたまりが最後の単語（${n-1}番）まで届いていないか、はみ出しています。`);

  if(!Number.isInteger(w.sentence)||!L.sentences[w.sentence])add(`${k}「${w.w}」：sentence は 0〜${L.sentences.length-1} の番号にしてください。`);
  if(!Array.isArray(w.ok)||!w.ok.length||w.ok.some(x=>!str(x)))add(`${k}「${w.w}」：ok（正解にする言葉）を1つ以上入れてください。`);

 try{J=JSON.parse(t)}catch(e){S.aCheck={errors:['JSON として読めません。最初の { （または [ ）から最後の } （または ] ）まで、全部コピーできているか確かめてください。']};return S.aCheck}
 const list=Array.isArray(J)?J:[J];
 if(!list.length){S.aCheck={errors:['[ ] の中にレッスンがありません。']};return S.aCheck}
 if(list.length>60){S.aCheck={errors:['一度に保存できるのは60レッスンまでです。分けて貼ってください。']};return S.aCheck}
 const items=list.map(L=>({L,errors:lessonErrors(L)}));
 const ids=items.map(x=>typeof x.L?.lessonId==='string'?x.L.lessonId.trim():'');
 items.forEach((x,i)=>{if(ids[i]&&ids.indexOf(ids[i])!==i)x.errors.push(`同じ lessonId「${ids[i]}」が2つ以上あります。`)});
 S.aCheck={items,ok:items.every(x=>!x.errors.length)};
 return S.aCheck;
}
/* 画面で使う形にする（教室長のプレビュー用。答えも入ったまま） */
function viewLesson(L){
 const x=clone(L);
 x.words=Array.isArray(x.words)?x.words:[];x.source=String(x.source||'').trim();
 x.note=[x.textbook,/^\d+$/.test(String(x.unit??''))?`Unit ${x.unit}`:x.unit,/^\d+$/.test(String(x.part??''))?`Part ${x.part}`:x.part].filter(v=>v!==undefined&&v!==null&&String(v).trim()).join(' ');
 x.sentences.forEach(s=>{s.end=s.end||''});
 return x;
}
/* レッスンの正解を、生徒の答えと同じ形にする（正解の色分け表示に使う） */
function keyAnswers(L){
 const a=blankA(L);
 L.sentences.forEach((s,si)=>{
  a.pos[si]=s.tokens.map(t=>t.pos);
  a.bounds[si]=s.chunks.slice(0,-1).map(c=>c.to);
  s.chunks.forEach(c=>{a.roles[si][c.from+'-'+c.to]=c.role});
 });
 L.words.forEach(w=>{a.meanings[w.w]=w.example||(w.ok||[])[0]||''});
 return a;
}
/* プレビューでの採点（gas/Code.gs の studentResult と同じ形） */
function localResult(L,a){
 const g=grade(L,a);
 const tok=L.sentences.map((s,si)=>s.tokens.map((tk,ti)=>posOk(tk,a.pos[si][ti])));
 const grp=L.sentences.map((s,si)=>{const o={};chunksFrom(a.bounds[si],s.tokens.length).forEach(c=>{const k=c[0]+'-'+c[1],kc=s.chunks.find(x=>x.from===c[0]&&x.to===c[1]);o[k]=!!kc&&kc.role===(a.roles[si][k]||'')});return o});
 const mean={};g.items.filter(i=>i.cat==='意味').forEach(i=>{mean[i.w]=i.ok});
 return{rate:g.rate,cats:g.cats,marks:{tok,grp,mean}};
}

const ILL_FILE=/^([A-Za-z0-9_-]{1,40})-([12])\.(jpe?g|png|webp)$/i;
/* 画像を横 720 ピクセルまでに小さくして、JPEG にする */
function shrinkImage(file){
 return new Promise((ok,ng)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
   const w=Math.min(720,img.naturalWidth),h=Math.round(img.naturalHeight*w/img.naturalWidth);
   const c=document.createElement('canvas');c.width=w;c.height=h;
   const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
   URL.revokeObjectURL(url);
   ok(c.toDataURL('image/jpeg',0.7).split(',')[1]);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);ng(new Error('画像として読めませんでした。'))};
  img.src=url;
 });
}

 else if(k==='alesson'){S.aLessonId=el.value;S.aSel=new Set();render()}
 else if(k==='adue'){S.aDue=el.value}
 else if(k==='aill'){uploadIlls([...el.files]);el.value=''}
 else if(k==='asel'){el.checked?S.aSel.add(el.value):S.aSel.delete(el.value);render()}
});
document.addEventListener('toggle',e=>{if(e.target.dataset?.keep==='posex')S.posEx=e.target.open},true);
window.addEventListener('pagehide',beaconFlush);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')beaconFlush()});

/* 動作確認スクリプト（tools/console-check.js）から使う */
window.HC={VERSION,api,state:S,render,get apiUrl(){return API_URL}};
start();
</script>
